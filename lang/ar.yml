ar:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'البيانات الشخصية'
    'GeneralNotice': 'بهذا الطلب (النموذج R0820) تطلب من هيئة التأمين التقاعدي الألمانية (Deutsche Rentenversicherung) إعانة لتأمينك الصحي الاختياري أو الخاص (§ 106 SGB VI). في حالة الورثة يجب تقديم طلب منفصل للأرملة / الأرمل ولكل يتيم.'
    'InsuranceNumber': 'رقم التأمين (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 خانة، مثل 12 150385 M 123. عند طلب معاش الورثة: رقم تأمين المؤمَّن عليه المتوفى.'
