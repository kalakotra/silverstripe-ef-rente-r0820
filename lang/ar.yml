  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'معاش تقاعدي آخر'
    'OtherPensionNotice': 'إذا كنت تتقاضى عدة معاشات من التأمين التقاعدي القانوني (مثل معاش الشيخوخة ومعاش الورثة)، تُحسب الإعانة من مجموع هذه المعاشات وتُدفع مع أحدها.'
    'OtherPension': '3.1 هل تتقاضى معاشاً آخر من التأمين التقاعدي القانوني الألماني أو هل قُدِّم طلب لمعاش آخر؟'
    'OtherPension.no': 'لا'
    'OtherPension.yes': 'نعم'
    'DEFAULT_SELECT': 'يرجى الاختيار'
    'OtherPensionInsurer': 'جهة التأمين التقاعدي'
    'OtherPensionNumber': 'رقم تأمين المعاش الآخر (اختياري)'
    'OtherPensionStatus': 'المعاش الآخر'
    'OtherPensionStatus.receiving': 'يُصرف حالياً'
    'OtherPensionStatus.applied': 'تم تقديم طلب له'
    'OtherPensionSince': 'منذ'
    'OtherPensionAppliedOn': 'تاريخ تقديم الطلب'
    'OtherPensionSubsidy': '3.2 هل تُدفع بالفعل إعانة للتأمين الصحي مع المعاش الآخر أو هل قُدِّم طلب لها؟'
    'OtherPensionSubsidy.no': 'لا'
    'OtherPensionSubsidy.yes': 'نعم'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'التأمين الصحي الحالي'
    'StatutoryVoluntary': '4.1 هل أنت مؤمَّن اختيارياً لدى صندوق تأمين صحي قانوني ألماني (AOK، Ersatzkasse، Betriebskrankenkasse، Innungskrankenkasse، Knappschaft أو صندوق التأمين الصحي الزراعي)؟'
    'StatutoryVoluntary.no': 'لا'
    'StatutoryVoluntary.yes': 'نعم'
    'DEFAULT_SELECT': 'يرجى الاختيار'
    'StatutoryVoluntaryDescription': 'يقوم صندوقك الصحي عندئذ بإرسال البيانات اللازمة بنفسه؛ ولا حاجة لشهادة عضوية.'
    'PrivateInsurance': '4.2 هل أنت مؤمَّن لدى شركة تأمين صحي خاصة ألمانية أو عضو في صندوق الرعاية الصحية لموظفي السكك الحديدية الاتحادية (KVB) أو صندوق التأمين الصحي لموظفي البريد (PBeaKK) أو في جماعة تضامنية معترف بها (Solidargemeinschaft)؟'
    'PrivateInsurance.no': 'لا'
    'PrivateInsurance.yes': 'نعم'
    'R0821Notice': 'يرجى أن تطلب من شركة التأمين أو KVB أو PBeaKK أو جماعتك التضامنية تعبئة النموذج R0821 وتأكيده.'
    'R0821Status': 'النموذج R0821'
    'R0821Status.attached': 'مرفق'
    'R0821Status.later': 'سيُقدَّم لاحقاً'
    'R0821Status.forwarded': 'تم إرساله'
    'ForeignInsurance': '4.3 هل أنت مؤمَّن اختيارياً لدى تأمين صحي قانوني أجنبي أو لدى شركة تأمين صحي خاصة تخضع لرقابة دولة عضو في الاتحاد الأوروبي (المملكة المتحدة حتى 31.12.2020 فقط) أو أيسلندا أو ليختنشتاين أو النرويج أو سويسرا؟'
    'ForeignInsurance.no': 'لا'
    'ForeignInsurance.yes': 'نعم'
    'R0822Notice': 'يرجى أن تطلب من شركة التأمين تعبئة النموذج R0822 وتأكيده.'
    'R0822Status': 'النموذج R0822'
    'R0822Status.attached': 'مرفق'
    'R0822Status.later': 'سيُقدَّم لاحقاً'
    'R0822Status.forwarded': 'تم إرساله'
    'MultipleInsurersNotice': 'إذا كنت مؤمَّناً لدى عدة شركات تأمين، فيجب على كل شركة تعبئة نموذج R0821 أو R0822 خاص بها.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'اشتراكات أفراد الأسرة'
    'FamilyNotice': 'يمكن احتساب اشتراكات الزوج أو الشريك المسجَّل أو الأطفال إذا لم يتجاوز إجمالي دخل فرد الأسرة 1/7 من القيمة المرجعية الشهرية (2026: 565 EUR؛ وفي حالة العمل البسيط 603 EUR)، ولم يكن هو نفسه مؤمَّناً إلزامياً في تأمين صحي قانوني ألماني أو أجنبي، ولم يكن له بصفته متقاعداً حق في إعانة التأمين الصحي.'
    'FamilyContributions': '4.4 هل يجب احتساب اشتراكات التأمين الصحي الخاص لأفراد الأسرة؟'
    'FamilyContributions.no': 'لا'
    'FamilyContributions.yes': 'نعم'
    'DEFAULT_SELECT': 'يرجى الاختيار'
    'FamilyFormNotice': 'يرجى تسجيل الاشتراكات أيضاً في النموذج R0821 / R0822.'
    'FamilyMemberLastName': 'اسم عائلة فرد الأسرة'
    'FamilyMemberFirstName': 'الاسم الأول'
    'FamilyMemberBirthDate': 'تاريخ الميلاد'
    'FamilyMemberRelationship': 'صلة القرابة'
    'FamilyMemberRelationship.spouse': 'زوج / زوجة (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'شريك حياة مسجَّل (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'طفل (Kind)'
    'FamilyMemberIncome': 'مبلغ إجمالي الدخل الشهري لفرد الأسرة (EUR)'
    'FamilyMemberIncomeDescription': 'لا يوجد دخل: يرجى إدخال 0.'
    'FamilyMemberPensioner': '4.4.1 هل فرد الأسرة متقاعد؟'
    'FamilyMemberPensioner.no': 'لا'
    'FamilyMemberPensioner.yes': 'نعم'
    'FamilyMemberPensionInsurer': 'جهة التأمين التقاعدي'
    'FamilyMemberPensionNumber': 'رقم التأمين (اختياري)'
    'FamilyMemberPensionSince': 'المعاش منذ'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'التأمين الإلزامي والوصول إلى المستندات'
    'CompulsoryInsurance': '4.5 هل يوجد أو كان يوجد، خلال الفترة التي تطلب عنها الإعانة، تأمين إلزامي في تأمين صحي قانوني ألماني أو أجنبي؟'
    'CompulsoryInsurance.no': 'لا'
    'CompulsoryInsurance.yes': 'نعم'
    'DEFAULT_SELECT': 'يرجى الاختيار'
    'CompulsoryInsuranceDescription': 'لا تُدفع الإعانة طالما كنت مؤمَّناً إلزامياً في تأمين صحي قانوني ألماني أو أجنبي. يرجى الإشارة أيضاً إذا كنت مسجَّلاً كمستحق لدى صندوق صحي ألماني على حساب دولة أخرى في الاتحاد الأوروبي أو أيسلندا أو ليختنشتاين أو النرويج أو سويسرا أو المملكة المتحدة.'
    'CompulsoryInsurer': 'اسم وعنوان صندوق التأمين الصحي أو الخدمة الصحية'
    'CompulsoryReason': 'سبب التأمين الإلزامي'
    'CompulsoryReasonDescription': 'مثل علاقة عمل، تأمين إلزامي كعاطل عن العمل، تأمين صحي للمقيمين.'
    'AccessibilityHeader': 'الوصول إلى المستندات للأشخاص ذوي الإعاقة البصرية'
    'AccessibilityNotice': 'يحق للأشخاص ذوي الإعاقة (مثل المكفوفين أو ضعاف البصر) الحصول على المستندات إضافياً بشكل يمكنهم إدراكه.'
    'AccessibleFormat': 'استلام المستندات إضافياً (اختياري)'
    'AccessibleFormat.large_print': 'بخط كبير'
    'AccessibleFormat.braille_short': 'بطريقة برايل (مختصرة)'
    'AccessibleFormat.braille_full': 'بطريقة برايل (كاملة)'
    'AccessibleFormat.cd': 'على قرص CD (ملف نصي بصيغة ".doc")'
    'AccessibleFormat.daisy': 'كوسيط صوتي (صيغة CD-DAISY)'
    'AccessibleFormatNone': 'غير مطلوب'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'إقرار مقدِّم الطلب'
    'DeclarationIntro': 'أقرّ بأنني قدّمت جميع البيانات في هذا النموذج وفق أفضل ما لديّ من معرفة. وأعلم أن تقديم بيانات خاطئة عن علم قد يؤدي إلى الملاحقة الجنائية.'
    'DeclarationDuties': 'ألتزم بإبلاغ جهة التأمين التقاعدي فوراً بالأمور التالية:'
    'DutyA': 'a) انتهاء أو تعليق التأمين الذي تُدفع عنه الإعانة (مثلاً عند استحقاق رعاية صحية بموجب قانون رعاية ضحايا الحرب الاتحادي (Bundesversorgungsgesetz) أو قانون التعويض الاتحادي (Bundesentschädigungsgesetz) أو عند الإقامة في الخارج)،'
    'DutyB': 'b) أي تغيير في مبلغ الاشتراك أو القسط للتأمين الصحي الخاص،'
    'DutyC': 'c) بدء التأمين الإلزامي في التأمين الصحي القانوني الألماني (مثلاً ببدء عمل، أو بطلب معاش آخر، أو بتقاضي بدل انتقالي أو إعانة بطالة أو إعانة الضمان الأساسي / Bürgergeld)،'
    'DutyD': 'd) بدء التأمين الإلزامي في تأمين صحي قانوني أجنبي (مثلاً عند نقل الإقامة إلى الخارج أو بدء عمل في الخارج أو بسبب بدء معاش أجنبي)،'
    'DutyE': 'e) "التسجيل" (Einschreibung) كمستحق لدى صندوق تأمين صحي قانوني ألماني بسبب معاش من دولة أخرى في الاتحاد الأوروبي أو أيسلندا أو ليختنشتاين أو النرويج أو سويسرا أو المملكة المتحدة،'
    'DutyF': 'f) أي تغيير في أوضاع فرد الأسرة الذي تُحتسب اشتراكاته في الإعانة (حق شخصي في معاش، بدء تأمين إلزامي، تغيّر الاشتراكات أو إجمالي الدخل) و'
    'DutyG': 'g) الانتقال إلى دولة أخرى.'
    'DeclarationAccepted': 'قرأت الإقرار وأؤكده.'
    'BeihilfeNotice': 'إذا كان لديك حق في Beihilfe (إعانة الموظفين الحكوميين)، فاسأل جهة Beihilfe المختصة عمّا إذا كانت الإعانة تؤثر على حقك. يمكنك التنازل عن الإعانة أو جزء منها بأثر مستقبلي.'
    'Place': 'المكان'
    'PlaceDescription': 'يُدرج التاريخ تلقائياً عند إنشاء ملف PDF. بالنسبة للأيتام يوقّع الممثل القانوني.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'عنوان بريدك الإلكتروني:'
    'AcceptTerms': 'لقد قرأت <a href="/de/agb" target="_blank">الشروط والأحكام العامة</a> و<a href="/de/datenschutz" target="_blank">سياسة الخصوصية</a> وأوافق عليهما.'
    'AcceptNoReturn': 'أوافق صراحةً على أن تبدأوا في تنفيذ العقد قبل انتهاء مهلة الانسحاب. وأعلم أنني بهذه الموافقة أفقد حقي في الانسحاب عند بدء تنفيذ العقد.'
    'SignatureRequired': 'يرجى توقيع الطلب.'
  'Kalakotra\EFormRenteR0820\Forms\StepTrait':
    'REQUIRED': 'حقل "{name}" مطلوب.'
    'REQUIRED_SUMMARY': 'يرجى ملء الحقول الإلزامية التالية: {fields}'
  'Kalakotra\EFormRenteR0820\Forms\Form':
    'SAVE_ERROR': 'حدثت مشكلة أثناء حفظ بياناتك. يرجى المحاولة مرة أخرى.'
