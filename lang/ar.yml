    'City': 'مكان الإقامة'
    'Country': 'الدولة (فقط في حال الإقامة في الخارج)'
    'Phone': 'الهاتف (اختياري)'
    'Fax': 'الفاكس (اختياري)'
    'InsuranceNumberInvalid': 'يجب أن يتكون رقم التأمين من 12 خانة (8 أرقام، حرف واحد، 3 أرقام).'
