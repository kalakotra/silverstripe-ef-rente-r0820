    'Title': 'اللقب العلمي (مثل Prof. Dr. med.) (اختياري)'
    'BirthName': 'اسم العائلة عند الولادة (اختياري)'
    'BirthDate': 'تاريخ الميلاد'
    'Street': 'الشارع، رقم المبنى'
