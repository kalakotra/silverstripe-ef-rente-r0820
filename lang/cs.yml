cs:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Osobní údaje'
    'GeneralNotice': 'Touto žádostí (formulář R0820) žádáte Německé důchodové pojištění (Deutsche Rentenversicherung) o příspěvek na své dobrovolné nebo soukromé zdravotní pojištění (§ 106 SGB VI). U pozůstalých se pro vdovu / vdovce a pro každého sirotka podává samostatná žádost.'
    'InsuranceNumber': 'Číslo pojištění (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 znaků, např. 12 150385 M 123. U žádosti o pozůstalostní důchod: číslo pojištění zemřelého pojištěnce.'
    'Kennzeichen': 'Označení (Kennzeichen, je-li známo)'
    'LastName': 'Příjmení'
    'FirstName': 'Jméno'
    'NameSuffix': 'Dodatek ke jménu (např. Freifrau, Graf) (nepovinné)'
    'NamePrefix': 'Předpona příjmení (např. von, van, de) (nepovinné)'
    'Title': 'Titul (např. Prof. Dr. med.) (nepovinné)'
    'BirthName': 'Rodné příjmení (nepovinné)'
    'BirthDate': 'Datum narození'
    'Street': 'Ulice, číslo domu'
    'AddressAddition': 'Doplněk adresy (nepovinné)'
    'PostalCode': 'PSČ'
    'PostalCodeDescription': 'Zahraniční PSČ delší než 5 znaků uveďte prosím v poli Místo bydliště.'
