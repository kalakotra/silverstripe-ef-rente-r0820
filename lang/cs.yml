  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Další důchod'
    'OtherPensionNotice': 'Pobíráte-li více důchodů ze zákonného důchodového pojištění (např. starobní a pozůstalostní důchod), příspěvek se vypočítá ze součtu těchto důchodů a vyplácí se s jedním z nich.'
    'OtherPension': '3.1 Pobíráte další důchod z německého zákonného důchodového pojištění nebo byla podána žádost o další důchod?'
    'OtherPension.no': 'ne'
    'OtherPension.yes': 'ano'
    'DEFAULT_SELECT': 'Vyberte prosím'
    'OtherPensionInsurer': 'Nositel důchodového pojištění'
    'OtherPensionNumber': 'Číslo pojištění dalšího důchodu (nepovinné)'
    'OtherPensionStatus': 'Další důchod je'
    'OtherPensionStatus.receiving': 'již pobírán'
    'OtherPensionStatus.applied': 'požadován'
    'OtherPensionSince': 'od'
    'OtherPensionAppliedOn': 'žádost podána dne'
    'OtherPensionSubsidy': '3.2 Vyplácí se k dalšímu důchodu již příspěvek na zdravotní pojištění nebo byla o něj podána žádost?'
    'OtherPensionSubsidy.no': 'ne'
    'OtherPensionSubsidy.yes': 'ano'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Stávající zdravotní pojištění'
    'StatutoryVoluntary': '4.1 Jste dobrovolně pojištěni u německé zákonné zdravotní pojišťovny (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft nebo zemědělská zdravotní pojišťovna)?'
    'StatutoryVoluntary.no': 'ne'
    'StatutoryVoluntary.yes': 'ano'
    'DEFAULT_SELECT': 'Vyberte prosím'
    'StatutoryVoluntaryDescription': 'Vaše zdravotní pojišťovna pak potřebné údaje předá sama; potvrzení o členství není potřeba.'
    'PrivateInsurance': '4.2 Jste pojištěni u německé soukromé zdravotní pojišťovny nebo jste členem zdravotní péče spolkových železničních úředníků (KVB), zdravotní pojišťovny poštovních úředníků (PBeaKK) nebo uznaného solidárního společenství (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'ne'
    'PrivateInsurance.yes': 'ano'
    'R0821Notice': 'Požádejte prosím svou pojišťovnu, KVB, PBeaKK nebo své solidární společenství o vyplnění a potvrzení formuláře R0821.'
    'R0821Status': 'Formulář R0821'
    'R0821Status.attached': 'je přiložen'
    'R0821Status.later': 'bude doložen dodatečně'
    'R0821Status.forwarded': 'byl předán'
    'ForeignInsurance': '4.3 Jste dobrovolně pojištěni u zahraničního zákonného zdravotního pojištění nebo u soukromé zdravotní pojišťovny pod dozorem členského státu EU (Spojené království jen do 31.12.2020), Islandu, Lichtenštejnska, Norska nebo Švýcarska?'
    'ForeignInsurance.no': 'ne'
    'ForeignInsurance.yes': 'ano'
    'R0822Notice': 'Požádejte prosím svou pojišťovnu o vyplnění a potvrzení formuláře R0822.'
    'R0822Status': 'Formulář R0822'
    'R0822Status.attached': 'je přiložen'
    'R0822Status.later': 'bude doložen dodatečně'
    'R0822Status.forwarded': 'byl předán'
    'MultipleInsurersNotice': 'Jste-li pojištěni u více pojišťoven, musí každá z nich vyplnit vlastní formulář R0821 nebo R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Příspěvky za rodinné příslušníky'
    'FamilyNotice': 'Příspěvky za manžela, registrovaného partnera nebo děti lze zohlednit, pokud celkový příjem rodinného příslušníka nepřesahuje 1/7 měsíční referenční hodnoty (2026: 565 EUR; při zaměstnání malého rozsahu 603 EUR), sám není povinně pojištěn v německém nebo zahraničním zákonném zdravotním pojištění a jako důchodce nemá sám nárok na příspěvek na zdravotní pojištění.'
    'FamilyContributions': '4.4 Mají být zohledněny příspěvky na soukromé zdravotní pojištění rodinných příslušníků?'
    'FamilyContributions.no': 'ne'
    'FamilyContributions.yes': 'ano'
    'DEFAULT_SELECT': 'Vyberte prosím'
    'FamilyFormNotice': 'Nechte prosím příspěvky zapsat také do formuláře R0821 / R0822.'
    'FamilyMemberLastName': 'Příjmení rodinného příslušníka'
    'FamilyMemberFirstName': 'Jméno'
    'FamilyMemberBirthDate': 'Datum narození'
    'FamilyMemberRelationship': 'Příbuzenský vztah'
    'FamilyMemberRelationship.spouse': 'Manžel / manželka (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Registrovaný partner (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Dítě (Kind)'
    'FamilyMemberIncome': 'Výše celkového měsíčního příjmu rodinného příslušníka (EUR)'
    'FamilyMemberIncomeDescription': 'Bez příjmu: zadejte 0.'
    'FamilyMemberPensioner': '4.4.1 Je rodinný příslušník důchodce?'
    'FamilyMemberPensioner.no': 'ne'
    'FamilyMemberPensioner.yes': 'ano'
    'FamilyMemberPensionInsurer': 'Nositel důchodového pojištění'
    'FamilyMemberPensionNumber': 'Číslo pojištění (nepovinné)'
    'FamilyMemberPensionSince': 'Důchod od'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Povinné pojištění a přístup k dokumentům'
    'CompulsoryInsurance': '4.5 Existuje nebo existovalo v období, za které žádáte o příspěvek, povinné pojištění v německém nebo zahraničním zákonném zdravotním pojištění?'
    'CompulsoryInsurance.no': 'ne'
    'CompulsoryInsurance.yes': 'ano'
    'DEFAULT_SELECT': 'Vyberte prosím'
    'CompulsoryInsuranceDescription': 'Příspěvek se nevyplácí, dokud jste povinně pojištěni v německém nebo zahraničním zákonném zdravotním pojištění. Uveďte také, zda jste u německé zdravotní pojišťovny zapsáni jako oprávněná osoba na účet jiného státu EU, Islandu, Lichtenštejnska, Norska, Švýcarska nebo Spojeného království.'
    'CompulsoryInsurer': 'Název a adresa zdravotní pojišťovny nebo zdravotní služby'
    'CompulsoryReason': 'Důvod povinného pojištění'
    'CompulsoryReasonDescription': 'Například pracovní poměr, povinné pojištění jako nezaměstnaný, zdravotní pojištění obyvatel.'
    'AccessibilityHeader': 'Přístup k dokumentům pro zrakově postižené'
    'AccessibilityNotice': 'Osoby se zdravotním postižením (např. nevidomí nebo slabozrací) mají nárok dostávat dokumenty navíc ve formě, kterou mohou vnímat.'
    'AccessibleFormat': 'Dostávat dokumenty navíc (nepovinné)'
    'AccessibleFormat.large_print': 've zvětšeném písmu'
    'AccessibleFormat.braille_short': 'v Braillově písmu (zkratkovém)'
    'AccessibleFormat.braille_full': 'v Braillově písmu (plném)'
    'AccessibleFormat.cd': 'na CD (textový soubor ve formátu ".doc")'
    'AccessibleFormat.daisy': 'jako zvukové médium (formát CD-DAISY)'
    'AccessibleFormatNone': 'není potřeba'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Prohlášení žadatele'
    'DeclarationIntro': 'Prohlašuji, že jsem všechny údaje v tomto formuláři uvedl/a podle svého nejlepšího vědomí. Je mi známo, že vědomě nepravdivé údaje mohou vést k trestnímu stíhání.'
    'DeclarationDuties': 'Zavazuji se neprodleně oznámit nositeli důchodového pojištění následující skutečnosti:'
    'DutyA': 'a) ukončení nebo přerušení pojištění, ke kterému se příspěvek vyplácí (např. při nároku na zdravotní péči podle spolkového zákona o zaopatření obětí války (Bundesversorgungsgesetz), spolkového zákona o odškodnění (Bundesentschädigungsgesetz) nebo při pobytu v zahraničí),'
    'DutyB': 'b) každou změnu výše pojistného nebo pojistné prémie soukromého zdravotního pojištění,'
    'DutyC': 'c) začátek povinného pojištění v německém zákonném zdravotním pojištění (např. nástupem do zaměstnání, žádostí o další důchod, pobíráním přechodné dávky, podpory v nezaměstnanosti nebo základního zabezpečení / Bürgergeld),'
    'DutyD': 'd) začátek povinného pojištění v zahraničním zákonném zdravotním pojištění (např. při přestěhování do zahraničí, nástupu do zaměstnání v zahraničí nebo z důvodu začátku zahraničního důchodu),'
    'DutyE': 'e) „zápis“ (Einschreibung) jako oprávněné osoby u německé zákonné zdravotní pojišťovny na základě důchodu jiného státu EU, Islandu, Lichtenštejnska, Norska, Švýcarska nebo Spojeného království,'
    'DutyF': 'f) každou změnu poměrů rodinného příslušníka, jehož příspěvky se při výplatě příspěvku zohledňují (vlastní nárok na důchod, vznik povinného pojištění, změny příspěvků nebo celkového příjmu) a'
    'DutyG': 'g) přestěhování do jiného státu.'
    'DeclarationAccepted': 'Prohlášení jsem si přečetl/a a potvrzuji je.'
    'BeihilfeNotice': 'Máte-li nárok na Beihilfe (příspěvek pro státní úředníky), zeptejte se svého úřadu Beihilfe, zda příspěvek ovlivňuje váš nárok. Příspěvku nebo jeho části se můžete vzdát s účinkem do budoucna.'
    'Place': 'Místo'
    'PlaceDescription': 'Datum se doplní automaticky při vytvoření PDF. Za sirotky podepisuje zákonný zástupce.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Vaše e-mailová adresa:'
    'AcceptTerms': 'Přečetl(a) jsem si a přijímám <a href="/de/agb" target="_blank">obchodní podmínky</a> a <a href="/de/datenschutz" target="_blank">zásady ochrany osobních údajů</a>.'
    'AcceptNoReturn': 'Výslovně souhlasím s tím, abyste začali plnit smlouvu před uplynutím lhůty pro odstoupení. Jsem si vědom(a), že tímto souhlasem ztrácím právo na odstoupení od smlouvy zahájením jejího plnění.'
    'SignatureRequired': 'Podepište prosím žádost.'
