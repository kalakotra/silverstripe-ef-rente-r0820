  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Inne świadczenie emerytalne'
    'OtherPensionNotice': 'Jeśli pobierasz kilka świadczeń z ustawowego ubezpieczenia emerytalnego (np. emeryturę i rentę rodzinną), dopłata jest obliczana od sumy tych świadczeń i wypłacana razem z jednym z nich.'
    'OtherPension': '3.1 Czy pobierasz inne świadczenie z niemieckiego ustawowego ubezpieczenia emerytalnego lub czy złożono wniosek o inne świadczenie?'
    'OtherPension.no': 'nie'
    'OtherPension.yes': 'tak'
    'DEFAULT_SELECT': 'Proszę wybrać'
    'OtherPensionInsurer': 'Instytucja ubezpieczenia emerytalnego'
    'OtherPensionNumber': 'Numer ubezpieczenia innego świadczenia (opcjonalnie)'
    'OtherPensionStatus': 'Inne świadczenie jest'
    'OtherPensionStatus.receiving': 'już pobierane'
    'OtherPensionStatus.applied': 'wnioskowane'
    'OtherPensionSince': 'od'
    'OtherPensionAppliedOn': 'wniosek złożono dnia'
    'OtherPensionSubsidy': '3.2 Czy do innego świadczenia jest już wypłacana dopłata do ubezpieczenia zdrowotnego lub czy złożono o nią wniosek?'
    'OtherPensionSubsidy.no': 'nie'
    'OtherPensionSubsidy.yes': 'tak'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Istniejące ubezpieczenie zdrowotne'
    'StatutoryVoluntary': '4.1 Czy jesteś dobrowolnie ubezpieczony w niemieckiej ustawowej kasie chorych (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft lub rolnicza kasa chorych)?'
    'StatutoryVoluntary.no': 'nie'
    'StatutoryVoluntary.yes': 'tak'
    'DEFAULT_SELECT': 'Proszę wybrać'
    'StatutoryVoluntaryDescription': 'Twoja kasa chorych sama przekaże wtedy potrzebne dane; zaświadczenie o członkostwie nie jest potrzebne.'
    'PrivateInsurance': '4.2 Czy jesteś ubezpieczony w niemieckim prywatnym towarzystwie ubezpieczeń zdrowotnych lub jesteś członkiem kasy opieki zdrowotnej urzędników kolei federalnych (KVB), kasy chorych urzędników pocztowych (PBeaKK) lub uznanej wspólnoty solidarnościowej (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'nie'
    'PrivateInsurance.yes': 'tak'
    'R0821Notice': 'Poproś swoje towarzystwo ubezpieczeniowe, KVB, PBeaKK lub wspólnotę solidarnościową o wypełnienie i potwierdzenie formularza R0821.'
    'R0821Status': 'Formularz R0821'
    'R0821Status.attached': 'jest załączony'
    'R0821Status.later': 'zostanie doręczony później'
    'R0821Status.forwarded': 'został przekazany'
    'ForeignInsurance': '4.3 Czy jesteś dobrowolnie ubezpieczony w zagranicznym ustawowym ubezpieczeniu zdrowotnym lub w prywatnym towarzystwie ubezpieczeń zdrowotnych podlegającym nadzorowi państwa członkowskiego UE (Zjednoczone Królestwo tylko do 31.12.2020), Islandii, Liechtensteinu, Norwegii lub Szwajcarii?'
    'ForeignInsurance.no': 'nie'
    'ForeignInsurance.yes': 'tak'
    'R0822Notice': 'Poproś swoje towarzystwo ubezpieczeniowe o wypełnienie i potwierdzenie formularza R0822.'
    'R0822Status': 'Formularz R0822'
    'R0822Status.attached': 'jest załączony'
    'R0822Status.later': 'zostanie doręczony później'
    'R0822Status.forwarded': 'został przekazany'
    'MultipleInsurersNotice': 'Jeśli jesteś ubezpieczony w kilku towarzystwach, każde z nich musi wypełnić osobny formularz R0821 lub R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Składki za członków rodziny'
    'FamilyNotice': 'Składki za małżonka, zarejestrowanego partnera lub dzieci mogą zostać uwzględnione, jeśli łączny dochód członka rodziny nie przekracza 1/7 miesięcznej wielkości referencyjnej (2026: 565 EUR; przy zatrudnieniu w niewielkim wymiarze 603 EUR), nie jest on sam obowiązkowo ubezpieczony w niemieckim lub zagranicznym ustawowym ubezpieczeniu zdrowotnym i jako emeryt nie ma sam prawa do dopłaty do ubezpieczenia zdrowotnego.'
    'FamilyContributions': '4.4 Czy należy uwzględnić składki na prywatne ubezpieczenie zdrowotne członków rodziny?'
    'FamilyContributions.no': 'nie'
    'FamilyContributions.yes': 'tak'
    'DEFAULT_SELECT': 'Proszę wybrać'
    'FamilyFormNotice': 'Prosimy wpisać składki również w formularzu R0821 / R0822.'
    'FamilyMemberLastName': 'Nazwisko członka rodziny'
    'FamilyMemberFirstName': 'Imię'
    'FamilyMemberBirthDate': 'Data urodzenia'
    'FamilyMemberRelationship': 'Stopień pokrewieństwa'
    'FamilyMemberRelationship.spouse': 'Małżonek / małżonka (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Zarejestrowany partner (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Dziecko (Kind)'
    'FamilyMemberIncome': 'Wysokość łącznego miesięcznego dochodu członka rodziny (EUR)'
    'FamilyMemberIncomeDescription': 'Brak dochodu: wpisz 0.'
    'FamilyMemberPensioner': '4.4.1 Czy członek rodziny jest emerytem?'
    'FamilyMemberPensioner.no': 'nie'
    'FamilyMemberPensioner.yes': 'tak'
    'FamilyMemberPensionInsurer': 'Instytucja ubezpieczenia emerytalnego'
    'FamilyMemberPensionNumber': 'Numer ubezpieczenia (opcjonalnie)'
    'FamilyMemberPensionSince': 'Świadczenie od'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Ubezpieczenie obowiązkowe i dostęp do dokumentów'
    'CompulsoryInsurance': '4.5 Czy w okresie, za który wnioskujesz o dopłatę, istnieje lub istniał obowiązek ubezpieczenia w niemieckim lub zagranicznym ustawowym ubezpieczeniu zdrowotnym?'
    'CompulsoryInsurance.no': 'nie'
    'CompulsoryInsurance.yes': 'tak'
    'DEFAULT_SELECT': 'Proszę wybrać'
    'CompulsoryInsuranceDescription': 'Dopłata nie jest wypłacana, dopóki jesteś obowiązkowo ubezpieczony w niemieckim lub zagranicznym ustawowym ubezpieczeniu zdrowotnym. Podaj również, jeśli jesteś zarejestrowany w niemieckiej kasie chorych jako uprawniony na koszt innego państwa UE, Islandii, Liechtensteinu, Norwegii, Szwajcarii lub Zjednoczonego Królestwa.'
    'CompulsoryInsurer': 'Nazwa i adres kasy chorych lub służby zdrowia'
    'CompulsoryReason': 'Przyczyna obowiązku ubezpieczenia'
    'CompulsoryReasonDescription': 'Na przykład stosunek pracy, obowiązkowe ubezpieczenie jako bezrobotny, ubezpieczenie zdrowotne mieszkańców.'
    'AccessibilityHeader': 'Dostęp do dokumentów dla osób niedowidzących'
    'AccessibilityNotice': 'Osoby z niepełnosprawnością (np. niewidome lub niedowidzące) mają prawo otrzymywać dokumenty dodatkowo w formie dla nich dostępnej.'
    'AccessibleFormat': 'Dodatkowo otrzymywać dokumenty (opcjonalnie)'
    'AccessibleFormat.large_print': 'dużym drukiem'
    'AccessibleFormat.braille_short': 'pismem Braille''a (skróconym)'
    'AccessibleFormat.braille_full': 'pismem Braille''a (pełnym)'
    'AccessibleFormat.cd': 'na płycie CD (plik tekstowy w formacie ".doc")'
    'AccessibleFormat.daisy': 'jako nośnik audio (format CD-DAISY)'
    'AccessibleFormatNone': 'nie jest wymagane'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Oświadczenie wnioskodawcy'
    'DeclarationIntro': 'Oświadczam, że wszystkie dane w tym formularzu podałem/podałam zgodnie z moją najlepszą wiedzą. Wiem, że świadome podanie nieprawdziwych danych może skutkować postępowaniem karnym.'
    'DeclarationDuties': 'Zobowiązuję się niezwłocznie zgłaszać instytucji ubezpieczenia emerytalnego następujące okoliczności:'
    'DutyA': 'a) zakończenie lub zawieszenie ubezpieczenia, do którego wypłacana jest dopłata (np. w przypadku prawa do opieki zdrowotnej na podstawie federalnej ustawy o zaopatrzeniu ofiar wojny (Bundesversorgungsgesetz), federalnej ustawy o odszkodowaniach (Bundesentschädigungsgesetz) lub pobytu za granicą),'
    'DutyB': 'b) każdą zmianę wysokości składki lub składki ubezpieczeniowej w prywatnym ubezpieczeniu zdrowotnym,'
    'DutyC': 'c) rozpoczęcie obowiązkowego ubezpieczenia w niemieckim ustawowym ubezpieczeniu zdrowotnym (np. przez podjęcie zatrudnienia, wniosek o inne świadczenie, pobieranie zasiłku przejściowego, zasiłku dla bezrobotnych lub zabezpieczenia podstawowego / Bürgergeld),'
    'DutyD': 'd) rozpoczęcie obowiązkowego ubezpieczenia w zagranicznym ustawowym ubezpieczeniu zdrowotnym (np. przy przeniesieniu miejsca zamieszkania za granicę, podjęciu pracy za granicą lub w związku z rozpoczęciem zagranicznej emerytury),'
    'DutyE': 'e) „rejestrację” (Einschreibung) jako uprawnionego w niemieckiej ustawowej kasie chorych na podstawie świadczenia z innego państwa UE, Islandii, Liechtensteinu, Norwegii, Szwajcarii lub Zjednoczonego Królestwa,'
    'DutyF': 'f) każdą zmianę sytuacji członka rodziny, którego składki są uwzględniane przy dopłacie (własne prawo do świadczenia, powstanie obowiązku ubezpieczenia, zmiany składek lub łącznego dochodu) oraz'
    'DutyG': 'g) przeprowadzkę do innego państwa.'
    'DeclarationAccepted': 'Przeczytałem/przeczytałam oświadczenie i je potwierdzam.'
    'BeihilfeNotice': 'Jeśli przysługuje Ci Beihilfe (pomoc dla urzędników), zapytaj swój urząd Beihilfe, czy dopłata wpływa na Twoje prawo. Możesz zrzec się dopłaty lub jej części ze skutkiem na przyszłość.'
    'Place': 'Miejscowość'
    'PlaceDescription': 'Data zostanie wpisana automatycznie przy tworzeniu pliku PDF. Za sieroty podpisuje przedstawiciel ustawowy.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Twój adres e-mail:'
    'AcceptTerms': 'Przeczytałem/am i akceptuję <a href="/de/agb" target="_blank">OWU</a> oraz <a href="/de/datenschutz" target="_blank">politykę prywatności</a>.'
    'AcceptNoReturn': 'Wyraźnie zgadzam się, aby rozpoczęli Państwo wykonywanie umowy przed upływem terminu na odstąpienie. Wiem, że wyrażając tę zgodę, tracę prawo odstąpienia z chwilą rozpoczęcia wykonywania umowy.'
    'SignatureRequired': 'Prosimy podpisać wniosek.'
  'Kalakotra\EFormRenteR0820\Forms\StepTrait':
    'REQUIRED': 'Pole „{name}” jest wymagane.'
    'REQUIRED_SUMMARY': 'Proszę wypełnić następujące pola obowiązkowe: {fields}'
  'Kalakotra\EFormRenteR0820\Forms\Form':
    'SAVE_ERROR': 'Wystąpił problem podczas zapisywania danych. Proszę spróbować ponownie.'
    'BOOLEAN_YES': 'Tak'
