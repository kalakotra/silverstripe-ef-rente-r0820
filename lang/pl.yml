pl:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Dane osobowe'
    'GeneralNotice': 'Tym wnioskiem (formularz R0820) ubiegasz się w Niemieckim Ubezpieczeniu Emerytalnym (Deutsche Rentenversicherung) o dopłatę do dobrowolnego lub prywatnego ubezpieczenia zdrowotnego (§ 106 SGB VI). W przypadku osób uprawnionych po zmarłym dla wdowy / wdowca i każdej sieroty składa się osobny wniosek.'
    'InsuranceNumber': 'Numer ubezpieczenia (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 znaków, np. 12 150385 M 123. Przy wniosku o rentę rodzinną: numer ubezpieczenia zmarłego ubezpieczonego.'
    'Kennzeichen': 'Oznaczenie (Kennzeichen, jeśli znane)'
    'LastName': 'Nazwisko'
    'FirstName': 'Imię'
    'NameSuffix': 'Dodatek do nazwiska (np. Freifrau, Graf) (opcjonalnie)'
    'NamePrefix': 'Przedrostek nazwiska (np. von, van, de) (opcjonalnie)'
    'Title': 'Tytuł (np. Prof. Dr. med.) (opcjonalnie)'
    'BirthName': 'Nazwisko rodowe (opcjonalnie)'
    'BirthDate': 'Data urodzenia'
    'Street': 'Ulica, numer domu'
    'AddressAddition': 'Uzupełnienie adresu (opcjonalnie)'
    'PostalCode': 'Kod pocztowy'
    'PostalCodeDescription': 'Zagraniczne kody pocztowe dłuższe niż 5 znaków prosimy wpisać w polu Miejsce zamieszkania.'
    'City': 'Miejsce zamieszkania'
    'Country': 'Kraj (tylko przy zamieszkaniu za granicą)'
    'Phone': 'Telefon (opcjonalnie)'
    'Fax': 'Faks (opcjonalnie)'
    'InsuranceNumberInvalid': 'Numer ubezpieczenia musi składać się z 12 znaków (8 cyfr, 1 litera, 3 cyfry).'
