  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Altra pensione'
    'OtherPensionNotice': 'Se percepisce più pensioni dell''assicurazione pensionistica obbligatoria (ad esempio pensione di vecchiaia e pensione ai superstiti), il contributo viene calcolato sulla somma di queste pensioni e pagato insieme a una di esse.'
    'OtherPension': '3.1 Percepisce un''altra pensione dall''assicurazione pensionistica obbligatoria tedesca oppure è stata richiesta un''altra pensione?'
    'OtherPension.no': 'no'
    'OtherPension.yes': 'sì'
    'DEFAULT_SELECT': 'Selezionare'
    'OtherPensionInsurer': 'Ente di assicurazione pensionistica'
    'OtherPensionNumber': 'Numero di assicurazione dell''altra pensione (facoltativo)'
    'OtherPensionStatus': 'L''altra pensione è'
    'OtherPensionStatus.receiving': 'già percepita'
    'OtherPensionStatus.applied': 'richiesta'
    'OtherPensionSince': 'dal'
    'OtherPensionAppliedOn': 'richiesta il'
    'OtherPensionSubsidy': '3.2 Viene già pagato o è stato richiesto un contributo all''assicurazione malattia per l''altra pensione?'
    'OtherPensionSubsidy.no': 'no'
    'OtherPensionSubsidy.yes': 'sì'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Copertura assicurativa malattia esistente'
    'StatutoryVoluntary': '4.1 È assicurato volontariamente presso una cassa malattia obbligatoria tedesca (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft o cassa malattia agricola)?'
    'StatutoryVoluntary.no': 'no'
    'StatutoryVoluntary.yes': 'sì'
    'DEFAULT_SELECT': 'Selezionare'
    'StatutoryVoluntaryDescription': 'In tal caso la sua cassa malattia trasmette direttamente i dati necessari; non serve un certificato di iscrizione.'
    'PrivateInsurance': '4.2 È assicurato presso una compagnia tedesca di assicurazione malattia privata oppure è membro della cassa sanitaria dei funzionari delle ferrovie federali (KVB), della cassa malattia dei funzionari delle poste (PBeaKK) o di una comunità solidale riconosciuta (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'no'
    'PrivateInsurance.yes': 'sì'
    'R0821Notice': 'Faccia compilare e confermare il modulo R0821 dalla sua compagnia di assicurazione, dalla KVB, dalla PBeaKK o dalla sua comunità solidale.'
    'R0821Status': 'Modulo R0821'
    'R0821Status.attached': 'è allegato'
    'R0821Status.later': 'verrà inviato successivamente'
    'R0821Status.forwarded': 'è stato inoltrato'
    'ForeignInsurance': '4.3 È assicurato volontariamente presso un''assicurazione malattia obbligatoria estera o presso una compagnia di assicurazione malattia privata soggetta alla vigilanza di uno Stato membro dell''UE (Regno Unito solo fino al 31.12.2020), dell''Islanda, del Liechtenstein, della Norvegia o della Svizzera?'
    'ForeignInsurance.no': 'no'
    'ForeignInsurance.yes': 'sì'
    'R0822Notice': 'Faccia compilare e confermare il modulo R0822 dalla sua compagnia di assicurazione.'
    'R0822Status': 'Modulo R0822'
    'R0822Status.attached': 'è allegato'
    'R0822Status.later': 'verrà inviato successivamente'
    'R0822Status.forwarded': 'è stato inoltrato'
    'MultipleInsurersNotice': 'Se è assicurato presso più compagnie, ciascuna deve compilare un proprio modulo R0821 o R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Contributi per familiari'
    'FamilyNotice': 'I contributi per il coniuge, il partner registrato o i figli possono essere considerati se il reddito complessivo del familiare non supera 1/7 della grandezza di riferimento mensile (2026: 565 EUR; in caso di impiego di modesta entità 603 EUR), se il familiare non è assicurato obbligatoriamente in un''assicurazione malattia obbligatoria tedesca o estera e se come pensionato non ha diritto proprio al contributo all''assicurazione malattia.'
    'FamilyContributions': '4.4 Devono essere considerati i contributi a un''assicurazione malattia privata per familiari?'
    'FamilyContributions.no': 'no'
    'FamilyContributions.yes': 'sì'
    'DEFAULT_SELECT': 'Selezionare'
    'FamilyFormNotice': 'Faccia indicare i contributi anche nel modulo R0821 / R0822.'
    'FamilyMemberLastName': 'Cognome del familiare'
    'FamilyMemberFirstName': 'Nome'
    'FamilyMemberBirthDate': 'Data di nascita'
    'FamilyMemberRelationship': 'Grado di parentela'
    'FamilyMemberRelationship.spouse': 'Coniuge (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Partner registrato (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Figlio/a (Kind)'
    'FamilyMemberIncome': 'Importo del reddito mensile complessivo del familiare (EUR)'
    'FamilyMemberIncomeDescription': 'Nessun reddito: indichi 0.'
    'FamilyMemberPensioner': '4.4.1 Il familiare è pensionato?'
    'FamilyMemberPensioner.no': 'no'
    'FamilyMemberPensioner.yes': 'sì'
    'FamilyMemberPensionInsurer': 'Ente di assicurazione pensionistica'
    'FamilyMemberPensionNumber': 'Numero di assicurazione (facoltativo)'
    'FamilyMemberPensionSince': 'Pensione dal'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Assicurazione obbligatoria e accesso ai documenti'
    'CompulsoryInsurance': '4.5 Nel periodo per cui richiede il contributo esiste o esisteva un obbligo assicurativo in un''assicurazione malattia obbligatoria tedesca o estera?'
    'CompulsoryInsurance.no': 'no'
    'CompulsoryInsurance.yes': 'sì'
    'DEFAULT_SELECT': 'Selezionare'
    'CompulsoryInsuranceDescription': 'Il contributo non viene pagato finché è assicurato obbligatoriamente in un''assicurazione malattia obbligatoria tedesca o estera. Lo indichi anche se è iscritto presso una cassa malattia tedesca come avente diritto a carico di un altro Stato dell''UE, dell''Islanda, del Liechtenstein, della Norvegia, della Svizzera o del Regno Unito.'
    'CompulsoryInsurer': 'Nome e indirizzo della cassa malattia o del servizio sanitario'
    'CompulsoryReason': 'Motivo dell''obbligo assicurativo'
    'CompulsoryReasonDescription': 'Ad esempio rapporto di lavoro, assicurazione obbligatoria come disoccupato, assicurazione sanitaria dei residenti.'
    'AccessibilityHeader': 'Accesso ai documenti per persone ipovedenti'
    'AccessibilityNotice': 'Le persone con disabilità (ad esempio cieche o ipovedenti) hanno diritto a ricevere i documenti anche in una forma per loro percepibile.'
    'AccessibleFormat': 'Ricevere i documenti anche (facoltativo)'
    'AccessibleFormat.large_print': 'in caratteri grandi'
    'AccessibleFormat.braille_short': 'in Braille (abbreviato)'
    'AccessibleFormat.braille_full': 'in Braille (integrale)'
    'AccessibleFormat.cd': 'su CD (file di testo in formato ".doc")'
    'AccessibleFormat.daisy': 'come supporto audio (formato CD-DAISY)'
    'AccessibleFormatNone': 'non necessario'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Dichiarazione del richiedente'
    'DeclarationIntro': 'Dichiaro di aver fornito tutte le indicazioni di questo modulo secondo scienza e coscienza. Sono consapevole che indicazioni consapevolmente false possono comportare un procedimento penale.'
    'DeclarationDuties': 'Mi impegno a comunicare immediatamente all''ente di assicurazione pensionistica le seguenti circostanze:'
    'DutyA': 'a) la cessazione o la sospensione dell''assicurazione per cui viene pagato il contributo (ad esempio in caso di diritto all''assistenza sanitaria secondo la legge federale sull''assistenza alle vittime di guerra (Bundesversorgungsgesetz), la legge federale sugli indennizzi (Bundesentschädigungsgesetz) o in caso di soggiorno all''estero),'
    'DutyB': 'b) ogni variazione dell''importo del contributo o del premio dell''assicurazione malattia privata,'
    'DutyC': 'c) l''inizio di un obbligo assicurativo nell''assicurazione malattia obbligatoria tedesca (ad esempio con l''inizio di un impiego, la domanda di un''altra pensione, la percezione di un''indennità transitoria, dell''indennità di disoccupazione o del reddito di base / Bürgergeld),'
    'DutyD': 'd) l''inizio di un obbligo assicurativo in un''assicurazione malattia obbligatoria estera (ad esempio con il trasferimento della residenza all''estero, l''inizio di un impiego all''estero o l''inizio di una pensione estera),'
    'DutyE': 'e) l''"iscrizione" (Einschreibung) come avente diritto presso una cassa malattia obbligatoria tedesca in base alla pensione di un altro Stato dell''UE, dell''Islanda, del Liechtenstein, della Norvegia, della Svizzera o del Regno Unito,'
    'DutyF': 'f) ogni variazione della situazione del familiare i cui contributi sono considerati per il contributo (diritto proprio a pensione, inizio dell''obbligo assicurativo, variazioni dei contributi o del reddito complessivo) e'
    'DutyG': 'g) il trasferimento in un altro Stato.'
    'DeclarationAccepted': 'Ho letto la dichiarazione e la confermo.'
    'BeihilfeNotice': 'Se ha diritto alla Beihilfe (sussidio per dipendenti pubblici), chieda al suo ufficio Beihilfe se il contributo incide sul suo diritto. Può rinunciare al contributo o a parte di esso con effetto per il futuro.'
    'Place': 'Luogo'
    'PlaceDescription': 'La data viene inserita automaticamente alla creazione del PDF. Per gli orfani firma il rappresentante legale.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Il suo indirizzo e-mail:'
    'AcceptTerms': 'Ho letto e accetto le <a href="/de/agb" target="_blank">condizioni generali</a> e l''<a href="/de/datenschutz" target="_blank">informativa sulla privacy</a>.'
    'AcceptNoReturn': 'Acconsento espressamente che iniziate l''esecuzione del contratto prima della scadenza del termine di recesso. Sono consapevole che con questo consenso perdo il diritto di recesso all''inizio dell''esecuzione del contratto.'
    'SignatureRequired': 'Firmi la domanda.'
