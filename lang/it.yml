it:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Dati personali'
    'GeneralNotice': 'Con questa domanda (modulo R0820) richiede all''Assicurazione pensionistica tedesca (Deutsche Rentenversicherung) un contributo per la sua assicurazione malattia volontaria o privata (§ 106 SGB VI). Per i superstiti va presentata una domanda separata per la vedova / il vedovo e per ogni orfano.'
    'InsuranceNumber': 'Numero di assicurazione (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 caratteri, ad es. 12 150385 M 123. In caso di domanda di pensione ai superstiti: numero di assicurazione dell''assicurato deceduto.'
    'Kennzeichen': 'Codice (Kennzeichen, se noto)'
    'LastName': 'Cognome'
    'FirstName': 'Nome'
    'NameSuffix': 'Complemento del nome (ad es. Freifrau, Graf) (facoltativo)'
    'NamePrefix': 'Prefisso del cognome (ad es. von, van, de) (facoltativo)'
    'Title': 'Titolo (ad es. Prof. Dr. med.) (facoltativo)'
    'BirthName': 'Cognome di nascita (facoltativo)'
    'BirthDate': 'Data di nascita'
    'Street': 'Via, numero civico'
    'AddressAddition': 'Complemento dell''indirizzo (facoltativo)'
    'PostalCode': 'CAP'
    'PostalCodeDescription': 'I codici postali esteri con più di 5 caratteri vanno indicati nel campo Luogo di residenza.'
    'City': 'Luogo di residenza'
    'Country': 'Paese (solo in caso di residenza all''estero)'
    'Phone': 'Telefono (facoltativo)'
    'Fax': 'Fax (facoltativo)'
    'InsuranceNumberInvalid': 'Il numero di assicurazione deve essere composto da 12 caratteri (8 cifre, 1 lettera, 3 cifre).'
