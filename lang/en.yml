en:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Personal details'
    'GeneralNotice': 'With this application (form R0820) you apply to the German Pension Insurance (Deutsche Rentenversicherung) for a subsidy towards your voluntary or private health insurance (§ 106 SGB VI). For survivors, a separate application must be made for the widow / widower and for each orphan.'
    'InsuranceNumber': 'Insurance number (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 characters, e.g. 12 150385 M 123. For a survivor''s pension application: insurance number of the deceased insured person.'
    'Kennzeichen': 'Reference code (Kennzeichen, if known)'
    'LastName': 'Surname'
    'FirstName': 'First name'
    'NameSuffix': 'Name suffix (e.g. Freifrau, Graf) (optional)'
    'NamePrefix': 'Name prefix (e.g. von, van, de) (optional)'
    'Title': 'Title (e.g. Prof. Dr. med.) (optional)'
    'BirthName': 'Birth name (optional)'
    'BirthDate': 'Date of birth'
    'Street': 'Street, house number'
    'AddressAddition': 'Address addition (optional)'
    'PostalCode': 'Postcode'
    'PostalCodeDescription': 'Please enter foreign postcodes with more than 5 characters in the place of residence field.'
    'City': 'Place of residence'
    'Country': 'Country (only if you live abroad)'
    'Phone': 'Telephone (optional)'
    'Fax': 'Fax (optional)'
    'InsuranceNumberInvalid': 'The insurance number must consist of 12 characters (8 digits, 1 letter, 3 digits).'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step2':
    'IntroText': 'Application made by another person'
    'FiledByRepresentative': 'Is the application being made by a representative?'
    'FiledByRepresentative.no': 'no'
    'FiledByRepresentative.yes': 'yes'
    'DEFAULT_SELECT': 'Please select'
    'RepresentativeNotice': 'Please attach the power of attorney or the court order to the application.'
    'RepresentativeName': 'Surname, first name / office (case reference, if applicable)'
    'RepresentativeCapacity': 'acting as'
    'RepresentativeCapacity.legal': 'legal representative (gesetzlicher Vertreter)'
    'RepresentativeCapacity.guardian': 'guardian (Vormund)'
    'RepresentativeCapacity.custodian': 'custodian (Betreuer)'
    'RepresentativeCapacity.authorized': 'authorised representative (Bevollmächtigter)'
    'RepresentativeStreet': 'Street, house number'
    'RepresentativeAddressAddition': 'Address addition (optional)'
    'RepresentativePostalCode': 'Postcode'
    'RepresentativeCity': 'Place of residence'
    'RepresentativeCountry': 'Country (only if you live abroad)'
    'RepresentativePhone': 'Telephone (optional)'
    'RepresentativeFax': 'Fax (optional)'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Other pension'
    'OtherPensionNotice': 'If you receive several statutory pensions (for example an old-age pension and a survivor''s pension), the subsidy is calculated from the total of these pensions and paid with one of them.'
    'OtherPension': '3.1 Do you receive another pension from the German statutory pension insurance, or has another pension been applied for?'
    'OtherPension.no': 'no'
    'OtherPension.yes': 'yes'
    'DEFAULT_SELECT': 'Please select'
    'OtherPensionInsurer': 'Pension insurance institution'
    'OtherPensionNumber': 'Insurance number of the other pension (optional)'
    'OtherPensionStatus': 'The other pension is'
    'OtherPensionStatus.receiving': 'already being received'
    'OtherPensionStatus.applied': 'applied for'
    'OtherPensionSince': 'since'
    'OtherPensionAppliedOn': 'applied for on'
    'OtherPensionSubsidy': '3.2 Is a health insurance subsidy already being paid for the other pension, or has one been applied for?'
    'OtherPensionSubsidy.no': 'no'
    'OtherPensionSubsidy.yes': 'yes'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Existing health insurance cover'
    'StatutoryVoluntary': '4.1 Are you voluntarily insured with a German statutory health insurance fund (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft or agricultural health insurance fund)?'
    'StatutoryVoluntary.no': 'no'
    'StatutoryVoluntary.yes': 'yes'
    'DEFAULT_SELECT': 'Please select'
    'StatutoryVoluntaryDescription': 'Your health insurance fund will then transmit the required information itself; no certificate of membership is needed.'
    'PrivateInsurance': '4.2 Are you insured with a German private health insurance company or a member of the health care scheme for federal railway officials (KVB), the postal officials'' health insurance fund (PBeaKK) or a recognised solidarity community (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'no'
    'PrivateInsurance.yes': 'yes'
    'R0821Notice': 'Please have your insurance company, the KVB, the PBeaKK or your solidarity community complete and confirm form R0821.'
    'R0821Status': 'Form R0821'
    'R0821Status.attached': 'is attached'
    'R0821Status.later': 'will be submitted later'
    'R0821Status.forwarded': 'has been forwarded'
    'ForeignInsurance': '4.3 Are you voluntarily insured with a foreign statutory health insurance or with a private health insurance company supervised by a member state of the EU (United Kingdom only until 31.12.2020), Iceland, Liechtenstein, Norway or Switzerland?'
    'ForeignInsurance.no': 'no'
    'ForeignInsurance.yes': 'yes'
    'R0822Notice': 'Please have your insurance company complete and confirm form R0822.'
    'R0822Status': 'Form R0822'
    'R0822Status.attached': 'is attached'
    'R0822Status.later': 'will be submitted later'
    'R0822Status.forwarded': 'has been forwarded'
    'MultipleInsurersNotice': 'If you are insured with several insurance companies, each company must complete its own form R0821 or R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Contributions for family members'
    'FamilyNotice': 'Contributions for a spouse, civil partner or children can be taken into account if the family member''s total income does not exceed 1/7 of the monthly reference value (2026: 565 EUR; 603 EUR for marginal employment), the family member is not compulsorily insured in a German or foreign statutory health insurance and is not entitled to a health insurance subsidy as a pensioner.'
    'FamilyContributions': '4.4 Should contributions to a private health insurance for family members be taken into account?'
    'FamilyContributions.no': 'no'
    'FamilyContributions.yes': 'yes'
    'DEFAULT_SELECT': 'Please select'
    'FamilyFormNotice': 'Please also have the contributions entered in form R0821 / R0822.'
    'FamilyMemberLastName': 'Surname of the family member'
    'FamilyMemberFirstName': 'First name'
    'FamilyMemberBirthDate': 'Date of birth'
    'FamilyMemberRelationship': 'Relationship'
    'FamilyMemberRelationship.spouse': 'Spouse (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Civil partner (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Child (Kind)'
    'FamilyMemberIncome': 'Total monthly income of the family member (EUR)'
    'FamilyMemberIncomeDescription': 'No income: please enter 0.'
    'FamilyMemberPensioner': '4.4.1 Is the family member a pensioner?'
    'FamilyMemberPensioner.no': 'no'
    'FamilyMemberPensioner.yes': 'yes'
    'FamilyMemberPensionInsurer': 'Pension insurance institution'
    'FamilyMemberPensionNumber': 'Insurance number (optional)'
    'FamilyMemberPensionSince': 'Pension since'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Compulsory insurance and document access'
    'CompulsoryInsurance': '4.5 During the period for which you are applying for the subsidy, are or were you compulsorily insured in a German or foreign statutory health insurance?'
    'CompulsoryInsurance.no': 'no'
    'CompulsoryInsurance.yes': 'yes'
    'DEFAULT_SELECT': 'Please select'
    'CompulsoryInsuranceDescription': 'The subsidy is not paid while you are compulsorily insured in a German or foreign statutory health insurance. Please also state if you are registered with a German health insurance fund as a beneficiary at the expense of another EU state, Iceland, Liechtenstein, Norway, Switzerland or the United Kingdom.'
    'CompulsoryInsurer': 'Name and address of the health insurance fund or health service'
    'CompulsoryReason': 'Reason for compulsory insurance'
    'CompulsoryReasonDescription': 'For example employment, compulsory insurance as an unemployed person, residents'' health insurance.'
    'AccessibilityHeader': 'Document access for visually impaired people'
    'AccessibilityNotice': 'People with a disability (for example blind or visually impaired people) are entitled to receive documents additionally in a form they can perceive.'
    'AccessibleFormat': 'Receive documents additionally (optional)'
    'AccessibleFormat.large_print': 'in large print'
    'AccessibleFormat.braille_short': 'in Braille (contracted)'
    'AccessibleFormat.braille_full': 'in Braille (uncontracted)'
    'AccessibleFormat.cd': 'on CD (text file in ".doc" format)'
    'AccessibleFormat.daisy': 'as audio medium (CD-DAISY format)'
    'AccessibleFormatNone': 'not required'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Declaration of the applicant'
    'DeclarationIntro': 'I declare that I have given all information in this form to the best of my knowledge. I am aware that knowingly false information may lead to criminal prosecution.'
    'DeclarationDuties': 'I undertake to notify the pension insurance institution immediately of the following:'
    'DutyA': 'a) the end or suspension of the insurance for which the subsidy is paid (for example in the case of entitlement to health care under the Federal War Victims Relief Act (Bundesversorgungsgesetz), the Federal Compensation Act (Bundesentschädigungsgesetz) or a stay abroad),'
    'DutyB': 'b) every change in the amount of contributions or premiums to the private health insurance,'
    'DutyC': 'c) the start of compulsory insurance in the German statutory health insurance (for example by taking up employment, by applying for another pension, by receiving transitional allowance, unemployment benefit or basic income support / Bürgergeld),'
    'DutyD': 'd) the start of compulsory insurance in a foreign statutory health insurance (for example when moving abroad, taking up employment abroad or because a foreign pension begins),'
    'DutyE': 'e) the "registration" (Einschreibung) as a beneficiary with a German statutory health insurance fund on the basis of a pension from another state of the EU, Iceland, Liechtenstein, Norway, Switzerland or the United Kingdom,'
    'DutyF': 'f) every change in the circumstances of the family member whose contributions are taken into account for the subsidy (own pension entitlement, start of compulsory insurance, changes in contributions or total income) and'
    'DutyG': 'g) moving to another country.'
    'DeclarationAccepted': 'I have read the declaration and confirm it.'
    'BeihilfeNotice': 'If you are entitled to Beihilfe (civil service allowance), please ask your Beihilfe office whether the subsidy affects your entitlement. You may waive the subsidy or parts of it with effect for the future.'
    'Place': 'Place'
    'PlaceDescription': 'The date is entered automatically when the PDF is created. For orphans, the legal representative signs.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Your e-mail address:'
    'AcceptTerms': 'I have read and accept the <a href="/de/agb" target="_blank">terms and conditions</a> and the <a href="/de/datenschutz" target="_blank">privacy policy</a>.'
    'AcceptNoReturn': 'I expressly agree that you begin performing the contract before the withdrawal period expires. I am aware that by giving this consent I lose my right of withdrawal once performance of the contract begins.'
    'SignatureRequired': 'Please sign the application.'
  'Kalakotra\EFormRenteR0820\Forms\StepTrait':
    'REQUIRED': '"{name}" is required.'
    'REQUIRED_SUMMARY': 'Please fill in the following required fields: {fields}'
  'Kalakotra\EFormRenteR0820\Forms\Form':
    'SAVE_ERROR': 'There was a problem saving your data. Please try again.'
    'BOOLEAN_YES': 'Yes'
