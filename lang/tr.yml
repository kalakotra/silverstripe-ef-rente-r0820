  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Zorunlu sigorta ve belgelere erişim'
    'CompulsoryInsurance': '4.5 Katkı payı talep ettiğiniz dönemde Alman veya yabancı bir yasal sağlık sigortasında zorunlu sigortalılığınız var mı veya var mıydı?'
    'CompulsoryInsurance.no': 'hayır'
    'CompulsoryInsurance.yes': 'evet'
    'DEFAULT_SELECT': 'Lütfen seçin'
    'CompulsoryInsuranceDescription': 'Alman veya yabancı yasal sağlık sigortasında zorunlu sigortalı olduğunuz sürece katkı payı ödenmez. Başka bir AB devleti, İzlanda, Lihtenştayn, Norveç, İsviçre veya Birleşik Krallık hesabına bir Alman sağlık kasasında hak sahibi olarak kayıtlıysanız lütfen bunu da belirtin.'
    'CompulsoryInsurer': 'Sağlık kasasının veya sağlık hizmetinin adı ve adresi'
    'CompulsoryReason': 'Zorunlu sigortalılığın nedeni'
    'CompulsoryReasonDescription': 'Örneğin çalışma ilişkisi, işsiz olarak zorunlu sigorta, sakinler için sağlık sigortası.'
    'AccessibilityHeader': 'Görme engelliler için belgelere erişim'
    'AccessibilityNotice': 'Engelli kişiler (örneğin görme engelliler) belgeleri ek olarak algılayabilecekleri bir biçimde alma hakkına sahiptir.'
    'AccessibleFormat': 'Belgeleri ek olarak alma (isteğe bağlı)'
    'AccessibleFormat.large_print': 'büyük puntoyla'
    'AccessibleFormat.braille_short': 'Braille alfabesiyle (kısaltmalı)'
    'AccessibleFormat.braille_full': 'Braille alfabesiyle (tam)'
    'AccessibleFormat.cd': 'CD olarak (".doc" formatında metin dosyası)'
    'AccessibleFormat.daisy': 'sesli ortam olarak (CD-DAISY formatı)'
    'AccessibleFormatNone': 'gerekli değil'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Başvuru sahibinin beyanı'
    'DeclarationIntro': 'Bu formdaki tüm bilgileri bildiğim kadarıyla doğru verdiğimi beyan ederim. Bile bile yanlış bilgi vermenin cezai kovuşturmaya yol açabileceğini biliyorum.'
    'DeclarationDuties': 'Aşağıdaki durumları emeklilik sigortası kurumuna derhal bildirmeyi taahhüt ederim:'
    'DutyA': 'a) katkı payının ödendiği sigortanın sona ermesi veya askıya alınması (örneğin Federal Savaş Mağdurlarına Bakım Yasası (Bundesversorgungsgesetz), Federal Tazminat Yasası (Bundesentschädigungsgesetz) uyarınca sağlık hizmeti hakkı veya yurt dışında kalış durumunda),'
    'DutyB': 'b) özel sağlık sigortası prim tutarındaki her değişiklik,'
    'DutyC': 'c) Alman yasal sağlık sigortasında zorunlu sigortalılığın başlaması (örneğin bir işe başlanması, başka bir aylık için başvuru, geçiş ödeneği, işsizlik parası veya temel güvence / Bürgergeld alınması),'
    'DutyD': 'd) yabancı yasal sağlık sigortasında zorunlu sigortalılığın başlaması (örneğin yurt dışına taşınma, yurt dışında işe başlama veya yabancı bir aylığın başlaması),'
    'DutyE': 'e) başka bir AB devleti, İzlanda, Lihtenştayn, Norveç, İsviçre veya Birleşik Krallık''tan alınan aylık nedeniyle bir Alman yasal sağlık kasasına hak sahibi olarak "kayıt" (Einschreibung),'
    'DutyF': 'f) primleri katkı payında dikkate alınan aile bireyinin durumundaki her değişiklik (kendi aylık hakkı, zorunlu sigortalılığın başlaması, primlerde veya toplam gelirde değişiklik) ve'
    'DutyG': 'g) başka bir ülkeye taşınma.'
    'DeclarationAccepted': 'Beyanı okudum ve onaylıyorum.'
    'BeihilfeNotice': 'Beihilfe (memur sağlık yardımı) hakkınız varsa, katkı payının bu hakkı etkileyip etkilemediğini Beihilfe biriminize sorun. Katkı payından veya bir kısmından ileriye dönük olarak feragat edebilirsiniz.'
    'Place': 'Yer'
    'PlaceDescription': 'Tarih, PDF oluşturulurken otomatik olarak girilir. Yetimler için yasal temsilci imzalar.'
