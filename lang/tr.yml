    'FamilyNotice': 'Eş, birlikte yaşanan partner veya çocuklar için ödenen primler; aile bireyinin toplam geliri aylık referans tutarın 1/7''sini (2026: 565 EUR; marjinal istihdamda 603 EUR) aşmıyorsa, kendisi Alman veya yabancı yasal sağlık sigortasında zorunlu sigortalı değilse ve emekli olarak kendisinin sağlık sigortası katkı payı hakkı yoksa dikkate alınabilir.'
