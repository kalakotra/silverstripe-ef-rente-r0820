es:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Datos personales'
    'GeneralNotice': 'Con esta solicitud (formulario R0820) solicita al Seguro de Pensiones Alemán (Deutsche Rentenversicherung) una subvención para su seguro de enfermedad voluntario o privado (§ 106 SGB VI). En caso de supervivientes, debe presentarse una solicitud separada para la viuda / el viudo y para cada huérfano.'
    'InsuranceNumber': 'Número de seguro (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 caracteres, p. ej. 12 150385 M 123. En solicitudes de pensión de supervivencia: número de seguro del asegurado fallecido.'
    'Kennzeichen': 'Código (Kennzeichen, si se conoce)'
    'LastName': 'Apellido'
    'FirstName': 'Nombre'
    'NameSuffix': 'Complemento del nombre (p. ej. Freifrau, Graf) (opcional)'
    'NamePrefix': 'Prefijo del apellido (p. ej. von, van, de) (opcional)'
    'Title': 'Título (p. ej. Prof. Dr. med.) (opcional)'
    'BirthName': 'Apellido de nacimiento (opcional)'
    'BirthDate': 'Fecha de nacimiento'
    'Street': 'Calle, número'
    'AddressAddition': 'Complemento de dirección (opcional)'
    'PostalCode': 'Código postal'
    'PostalCodeDescription': 'Los códigos postales extranjeros de más de 5 caracteres indíquelos en el campo Lugar de residencia.'
    'City': 'Lugar de residencia'
    'Country': 'País (solo si reside en el extranjero)'
    'Phone': 'Teléfono (opcional)'
    'Fax': 'Fax (opcional)'
    'InsuranceNumberInvalid': 'El número de seguro debe tener 12 caracteres (8 dígitos, 1 letra, 3 dígitos).'
