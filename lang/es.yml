  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Otra pensión'
    'OtherPensionNotice': 'Si percibe varias pensiones del seguro de pensiones legal (por ejemplo, pensión de jubilación y pensión de supervivencia), la subvención se calcula sobre la suma de estas pensiones y se abona con una de ellas.'
    'OtherPension': '3.1 ¿Percibe otra pensión del seguro de pensiones legal alemán o ha solicitado otra pensión?'
    'OtherPension.no': 'no'
    'OtherPension.yes': 'sí'
    'DEFAULT_SELECT': 'Seleccione'
    'OtherPensionInsurer': 'Entidad del seguro de pensiones'
    'OtherPensionNumber': 'Número de seguro de la otra pensión (opcional)'
    'OtherPensionStatus': 'La otra pensión'
    'OtherPensionStatus.receiving': 'ya se percibe'
    'OtherPensionStatus.applied': 'está solicitada'
    'OtherPensionSince': 'desde'
    'OtherPensionAppliedOn': 'solicitada el'
    'OtherPensionSubsidy': '3.2 ¿Se abona ya con la otra pensión una subvención al seguro de enfermedad o se ha solicitado?'
    'OtherPensionSubsidy.no': 'no'
    'OtherPensionSubsidy.yes': 'sí'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Seguro de enfermedad existente'
    'StatutoryVoluntary': '4.1 ¿Está asegurado voluntariamente en una caja de enfermedad legal alemana (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft o caja de enfermedad agraria)?'
    'StatutoryVoluntary.no': 'no'
    'StatutoryVoluntary.yes': 'sí'
    'DEFAULT_SELECT': 'Seleccione'
    'StatutoryVoluntaryDescription': 'En ese caso su caja de enfermedad transmitirá ella misma los datos necesarios; no se necesita certificado de afiliación.'
    'PrivateInsurance': '4.2 ¿Está asegurado en una compañía alemana de seguro de enfermedad privado o es miembro de la asistencia sanitaria de los funcionarios de los ferrocarriles federales (KVB), de la caja de enfermedad de los funcionarios de correos (PBeaKK) o de una comunidad solidaria reconocida (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'no'
    'PrivateInsurance.yes': 'sí'
    'R0821Notice': 'Pida a su compañía de seguros, a la KVB, a la PBeaKK o a su comunidad solidaria que rellene y confirme el formulario R0821.'
    'R0821Status': 'Formulario R0821'
    'R0821Status.attached': 'se adjunta'
    'R0821Status.later': 'se presentará posteriormente'
    'R0821Status.forwarded': 'se ha remitido'
    'ForeignInsurance': '4.3 ¿Está asegurado voluntariamente en un seguro de enfermedad legal extranjero o en una compañía de seguro de enfermedad privado sujeta a la supervisión de un Estado miembro de la UE (Reino Unido solo hasta el 31.12.2020), Islandia, Liechtenstein, Noruega o Suiza?'
    'ForeignInsurance.no': 'no'
    'ForeignInsurance.yes': 'sí'
    'R0822Notice': 'Pida a su compañía de seguros que rellene y confirme el formulario R0822.'
    'R0822Status': 'Formulario R0822'
    'R0822Status.attached': 'se adjunta'
    'R0822Status.later': 'se presentará posteriormente'
    'R0822Status.forwarded': 'se ha remitido'
    'MultipleInsurersNotice': 'Si está asegurado en varias compañías, cada una debe rellenar su propio formulario R0821 o R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Cotizaciones por familiares'
    'FamilyNotice': 'Las cotizaciones por el cónyuge, la pareja registrada o los hijos pueden tenerse en cuenta si los ingresos totales del familiar no superan 1/7 de la magnitud de referencia mensual (2026: 565 EUR; en empleo de menor cuantía 603 EUR), si el familiar no está asegurado obligatoriamente en un seguro de enfermedad legal alemán o extranjero y si como pensionista no tiene derecho propio a la subvención al seguro de enfermedad.'
    'FamilyContributions': '4.4 ¿Deben tenerse en cuenta las cotizaciones a un seguro de enfermedad privado por familiares?'
    'FamilyContributions.no': 'no'
    'FamilyContributions.yes': 'sí'
    'DEFAULT_SELECT': 'Seleccione'
    'FamilyFormNotice': 'Haga constar también las cotizaciones en el formulario R0821 / R0822.'
    'FamilyMemberLastName': 'Apellido del familiar'
    'FamilyMemberFirstName': 'Nombre'
    'FamilyMemberBirthDate': 'Fecha de nacimiento'
    'FamilyMemberRelationship': 'Parentesco'
    'FamilyMemberRelationship.spouse': 'Cónyuge (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Pareja registrada (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Hijo/a (Kind)'
    'FamilyMemberIncome': 'Importe de los ingresos mensuales totales del familiar (EUR)'
    'FamilyMemberIncomeDescription': 'Sin ingresos: indique 0.'
    'FamilyMemberPensioner': '4.4.1 ¿Es el familiar pensionista?'
    'FamilyMemberPensioner.no': 'no'
    'FamilyMemberPensioner.yes': 'sí'
    'FamilyMemberPensionInsurer': 'Entidad del seguro de pensiones'
    'FamilyMemberPensionNumber': 'Número de seguro (opcional)'
    'FamilyMemberPensionSince': 'Pensión desde'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Seguro obligatorio y acceso a documentos'
    'CompulsoryInsurance': '4.5 ¿Existe o existió, durante el período para el que solicita la subvención, un seguro obligatorio en un seguro de enfermedad legal alemán o extranjero?'
    'CompulsoryInsurance.no': 'no'
    'CompulsoryInsurance.yes': 'sí'
    'DEFAULT_SELECT': 'Seleccione'
    'CompulsoryInsuranceDescription': 'La subvención no se abona mientras esté asegurado obligatoriamente en un seguro de enfermedad legal alemán o extranjero. Indíquelo también si está inscrito en una caja de enfermedad alemana como beneficiario a cargo de otro Estado de la UE, Islandia, Liechtenstein, Noruega, Suiza o el Reino Unido.'
    'CompulsoryInsurer': 'Nombre y dirección de la caja de enfermedad o del servicio de salud'
    'CompulsoryReason': 'Motivo del seguro obligatorio'
    'CompulsoryReasonDescription': 'Por ejemplo, relación laboral, seguro obligatorio como desempleado, seguro de enfermedad de residentes.'
    'AccessibilityHeader': 'Acceso a documentos para personas con discapacidad visual'
    'AccessibilityNotice': 'Las personas con discapacidad (por ejemplo, ciegas o con discapacidad visual) tienen derecho a recibir los documentos adicionalmente en un formato que puedan percibir.'
    'AccessibleFormat': 'Recibir documentos adicionalmente (opcional)'
    'AccessibleFormat.large_print': 'en letra grande'
    'AccessibleFormat.braille_short': 'en braille (abreviado)'
    'AccessibleFormat.braille_full': 'en braille (integral)'
    'AccessibleFormat.cd': 'en CD (archivo de texto en formato ".doc")'
    'AccessibleFormat.daisy': 'como soporte de audio (formato CD-DAISY)'
    'AccessibleFormatNone': 'no es necesario'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Declaración del solicitante'
    'DeclarationIntro': 'Declaro que he facilitado todos los datos de este formulario según mi leal saber y entender. Sé que los datos falsos facilitados a sabiendas pueden dar lugar a un procedimiento penal.'
    'DeclarationDuties': 'Me comprometo a comunicar inmediatamente a la entidad del seguro de pensiones las siguientes circunstancias:'
    'DutyA': 'a) la finalización o suspensión del seguro para el que se abona la subvención (por ejemplo, en caso de derecho a asistencia sanitaria según la Ley Federal de Asistencia a las Víctimas de Guerra (Bundesversorgungsgesetz), la Ley Federal de Indemnización (Bundesentschädigungsgesetz) o en caso de estancia en el extranjero),'
    'DutyB': 'b) toda modificación del importe de la cotización o prima del seguro de enfermedad privado,'
    'DutyC': 'c) el inicio de un seguro obligatorio en el seguro de enfermedad legal alemán (por ejemplo, al comenzar un empleo, al solicitar otra pensión, al percibir subsidio de transición, prestación por desempleo o ingreso básico / Bürgergeld),'
    'DutyD': 'd) el inicio de un seguro obligatorio en un seguro de enfermedad legal extranjero (por ejemplo, al trasladar la residencia al extranjero, al comenzar un empleo en el extranjero o por el inicio de una pensión extranjera),'
    'DutyE': 'e) la "inscripción" (Einschreibung) como beneficiario en una caja de enfermedad legal alemana en virtud de la pensión de otro Estado de la UE, Islandia, Liechtenstein, Noruega, Suiza o el Reino Unido,'
    'DutyF': 'f) toda modificación de la situación del familiar cuyas cotizaciones se tienen en cuenta para la subvención (derecho propio a pensión, inicio de seguro obligatorio, cambios en las cotizaciones o en los ingresos totales) y'
    'DutyG': 'g) el traslado a otro Estado.'
    'DeclarationAccepted': 'He leído la declaración y la confirmo.'
    'BeihilfeNotice': 'Si tiene derecho a Beihilfe (ayuda para funcionarios), pregunte en su oficina de Beihilfe si la subvención afecta a su derecho. Puede renunciar a la subvención o a parte de ella con efectos para el futuro.'
    'Place': 'Lugar'
    'PlaceDescription': 'La fecha se introduce automáticamente al crear el PDF. En el caso de huérfanos firma el representante legal.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Su dirección de correo electrónico:'
    'AcceptTerms': 'He leído y acepto las <a href="/de/agb" target="_blank">condiciones generales</a> y la <a href="/de/datenschutz" target="_blank">política de privacidad</a>.'
    'AcceptNoReturn': 'Acepto expresamente que comiencen a ejecutar el contrato antes de que finalice el plazo de desistimiento. Soy consciente de que, con este consentimiento, pierdo mi derecho de desistimiento al comenzar la ejecución del contrato.'
    'SignatureRequired': 'Firme la solicitud.'
  'Kalakotra\EFormRenteR0820\Forms\StepTrait':
    'REQUIRED': '"{name}" es obligatorio.'
    'REQUIRED_SUMMARY': 'Rellene los siguientes campos obligatorios: {fields}'
