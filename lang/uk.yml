  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Інша пенсія'
    'OtherPensionNotice': 'Якщо ви отримуєте кілька пенсій з державного пенсійного страхування (наприклад, пенсію за віком і пенсію у зв''язку з втратою годувальника), субсидія розраховується із суми цих пенсій і виплачується разом з однією з них.'
    'OtherPension': '3.1 Чи отримуєте ви іншу пенсію з німецького державного пенсійного страхування або чи подано заяву на іншу пенсію?'
    'OtherPension.no': 'ні'
    'OtherPension.yes': 'так'
    'DEFAULT_SELECT': 'Будь ласка, оберіть'
    'OtherPensionInsurer': 'Пенсійний страховик'
    'OtherPensionNumber': 'Страховий номер іншої пенсії (необов''язково)'
    'OtherPensionStatus': 'Інша пенсія'
    'OtherPensionStatus.receiving': 'вже виплачується'
    'OtherPensionStatus.applied': 'заява подана'
    'OtherPensionSince': 'з'
    'OtherPensionAppliedOn': 'заяву подано'
    'OtherPensionSubsidy': '3.2 Чи вже виплачується до іншої пенсії субсидія до медичного страхування або чи подано заяву на неї?'
    'OtherPensionSubsidy.no': 'ні'
    'OtherPensionSubsidy.yes': 'так'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Наявне медичне страхування'
    'StatutoryVoluntary': '4.1 Чи застраховані ви добровільно в німецькій державній лікарняній касі (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft або сільськогосподарська лікарняна каса)?'
    'StatutoryVoluntary.no': 'ні'
    'StatutoryVoluntary.yes': 'так'
    'DEFAULT_SELECT': 'Будь ласка, оберіть'
    'StatutoryVoluntaryDescription': 'У такому разі ваша лікарняна каса сама передасть необхідні дані; довідка про членство не потрібна.'
    'PrivateInsurance': '4.2 Чи застраховані ви в німецькій приватній страховій компанії або є членом каси медичного забезпечення федеральних залізничних службовців (KVB), лікарняної каси поштових службовців (PBeaKK) чи визнаної солідарної спільноти (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'ні'
    'PrivateInsurance.yes': 'так'
    'R0821Notice': 'Будь ласка, попросіть вашу страхову компанію, KVB, PBeaKK або вашу солідарну спільноту заповнити та підтвердити формуляр R0821.'
    'R0821Status': 'Формуляр R0821'
    'R0821Status.attached': 'додано'
    'R0821Status.later': 'буде подано пізніше'
    'R0821Status.forwarded': 'переслано'
    'ForeignInsurance': '4.3 Чи застраховані ви добровільно в іноземному державному медичному страхуванні або в приватній страховій компанії під наглядом держави — члена ЄС (Велика Британія лише до 31.12.2020), Ісландії, Ліхтенштейну, Норвегії або Швейцарії?'
    'ForeignInsurance.no': 'ні'
    'ForeignInsurance.yes': 'так'
    'R0822Notice': 'Будь ласка, попросіть вашу страхову компанію заповнити та підтвердити формуляр R0822.'
    'R0822Status': 'Формуляр R0822'
    'R0822Status.attached': 'додано'
    'R0822Status.later': 'буде подано пізніше'
    'R0822Status.forwarded': 'переслано'
    'MultipleInsurersNotice': 'Якщо ви застраховані в кількох страхових компаніях, кожна з них має заповнити свій формуляр R0821 або R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Внески за членів сім''ї'
    'FamilyNotice': 'Внески за чоловіка/дружину, зареєстрованого партнера або дітей можуть бути враховані, якщо загальний дохід члена сім''ї не перевищує 1/7 місячної базової величини (2026: 565 EUR; у разі мінізайнятості 603 EUR), він сам не застрахований обов''язково в німецькому чи іноземному державному медичному страхуванні і як пенсіонер сам не має права на субсидію до медичного страхування.'
    'FamilyContributions': '4.4 Чи слід враховувати внески до приватного медичного страхування за членів сім''ї?'
    'FamilyContributions.no': 'ні'
    'FamilyContributions.yes': 'так'
    'DEFAULT_SELECT': 'Будь ласка, оберіть'
    'FamilyFormNotice': 'Будь ласка, попросіть внести внески також у формуляр R0821 / R0822.'
    'FamilyMemberLastName': 'Прізвище члена сім''ї'
    'FamilyMemberFirstName': 'Ім''я'
    'FamilyMemberBirthDate': 'Дата народження'
    'FamilyMemberRelationship': 'Ступінь спорідненості'
    'FamilyMemberRelationship.spouse': 'Чоловік / дружина (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Зареєстрований партнер (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Дитина (Kind)'
    'FamilyMemberIncome': 'Розмір загального місячного доходу члена сім''ї (EUR)'
    'FamilyMemberIncomeDescription': 'Немає доходу: вкажіть 0.'
    'FamilyMemberPensioner': '4.4.1 Чи є член сім''ї пенсіонером?'
    'FamilyMemberPensioner.no': 'ні'
    'FamilyMemberPensioner.yes': 'так'
    'FamilyMemberPensionInsurer': 'Пенсійний страховик'
    'FamilyMemberPensionNumber': 'Страховий номер (необов''язково)'
    'FamilyMemberPensionSince': 'Пенсія з'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Обов''язкове страхування та доступ до документів'
    'CompulsoryInsurance': '4.5 Чи існує або існувало в період, за який ви просите субсидію, обов''язкове страхування в німецькому чи іноземному державному медичному страхуванні?'
    'CompulsoryInsurance.no': 'ні'
    'CompulsoryInsurance.yes': 'так'
    'DEFAULT_SELECT': 'Будь ласка, оберіть'
    'CompulsoryInsuranceDescription': 'Субсидія не виплачується, поки ви обов''язково застраховані в німецькому чи іноземному державному медичному страхуванні. Вкажіть також, якщо ви зареєстровані в німецькій лікарняній касі як отримувач послуг за рахунок іншої держави ЄС, Ісландії, Ліхтенштейну, Норвегії, Швейцарії або Великої Британії.'
    'CompulsoryInsurer': 'Назва та адреса лікарняної каси або служби охорони здоров''я'
    'CompulsoryReason': 'Підстава обов''язкового страхування'
    'CompulsoryReasonDescription': 'Наприклад, трудові відносини, обов''язкове страхування як безробітного, страхування мешканців.'
    'AccessibilityHeader': 'Доступ до документів для людей з порушеннями зору'
    'AccessibilityNotice': 'Люди з інвалідністю (наприклад, сліпі або слабозорі) мають право додатково отримувати документи у доступній для них формі.'
    'AccessibleFormat': 'Додатково отримувати документи (необов''язково)'
    'AccessibleFormat.large_print': 'великим шрифтом'
    'AccessibleFormat.braille_short': 'шрифтом Брайля (скороченим)'
    'AccessibleFormat.braille_full': 'шрифтом Брайля (повним)'
    'AccessibleFormat.cd': 'на CD (текстовий файл у форматі ".doc")'
    'AccessibleFormat.daisy': 'як аудіоносій (формат CD-DAISY)'
    'AccessibleFormatNone': 'не потрібно'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Заява заявника'
    'DeclarationIntro': 'Запевняю, що всі дані в цьому формулярі я вказав(ла) наскільки мені відомо. Мені відомо, що свідомо неправдиві дані можуть призвести до кримінального переслідування.'
    'DeclarationDuties': 'Зобов''язуюся негайно повідомляти пенсійного страховика про такі обставини:'
    'DutyA': 'a) припинення або призупинення страхування, до якого виплачується субсидія (наприклад, у разі права на медичне забезпечення за Федеральним законом про забезпечення жертв війни (Bundesversorgungsgesetz), Федеральним законом про компенсацію (Bundesentschädigungsgesetz) або перебування за кордоном),'
    'DutyB': 'b) будь-яку зміну розміру внесків або страхової премії приватного медичного страхування,'
    'DutyC': 'c) початок обов''язкового страхування в німецькому державному медичному страхуванні (наприклад, у разі початку роботи, подання заяви на іншу пенсію, отримання перехідної допомоги, допомоги з безробіття або базової допомоги / Bürgergeld),'
    'DutyD': 'd) початок обов''язкового страхування в іноземному державному медичному страхуванні (наприклад, у разі переїзду за кордон, початку роботи за кордоном або через початок іноземної пенсії),'
    'DutyE': 'e) «реєстрацію» (Einschreibung) як отримувача послуг у німецькій державній лікарняній касі на підставі пенсії іншої держави ЄС, Ісландії, Ліхтенштейну, Норвегії, Швейцарії або Великої Британії,'
    'DutyF': 'f) будь-яку зміну обставин члена сім''ї, внески якого враховуються при виплаті субсидії (власне право на пенсію, настання обов''язкового страхування, зміна внесків або загального доходу) та'
    'DutyG': 'g) переїзд до іншої держави.'
    'DeclarationAccepted': 'Я прочитав(ла) заяву та підтверджую її.'
    'BeihilfeNotice': 'Якщо ви маєте право на Beihilfe (допомогу для державних службовців), запитайте у своєму відділі Beihilfe, чи впливає субсидія на ваше право. Ви можете відмовитися від субсидії або її частини на майбутнє.'
    'Place': 'Місце'
    'PlaceDescription': 'Дата вноситься автоматично під час створення PDF. За сиріт підписує законний представник.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Ваша адреса електронної пошти:'
    'AcceptTerms': 'Я прочитав(ла) і приймаю <a href="/de/agb" target="_blank">Загальні умови</a> та <a href="/de/datenschutz" target="_blank">Політику конфіденційності</a>.'
    'AcceptNoReturn': 'Я прямо погоджуюся, щоб Ви розпочали виконання договору до закінчення строку відмови. Мені відомо, що, надаючи цю згоду, я втрачаю право на відмову від договору з початком його виконання.'
    'SignatureRequired': 'Будь ласка, підпишіть заяву.'
  'Kalakotra\EFormRenteR0820\Forms\StepTrait':
    'REQUIRED': 'Поле «{name}» є обов''язковим.'
    'REQUIRED_SUMMARY': 'Будь ласка, заповніть такі обов''язкові поля: {fields}'
  'Kalakotra\EFormRenteR0820\Forms\Form':
    'SAVE_ERROR': 'Під час збереження Ваших даних виникла проблема. Будь ласка, спробуйте ще раз.'
    'BOOLEAN_YES': 'Так'
