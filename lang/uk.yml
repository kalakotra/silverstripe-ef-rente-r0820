uk:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Особисті дані'
    'GeneralNotice': 'Цією заявою (формуляр R0820) ви звертаєтеся до Німецького пенсійного страхування (Deutsche Rentenversicherung) по субсидію до вашого добровільного або приватного медичного страхування (§ 106 SGB VI). Для спадкоємців окрема заява подається на вдову / вдівця та на кожного сироту.'
    'InsuranceNumber': 'Страховий номер (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 знаків, напр. 12 150385 M 123. У разі заяви на пенсію у зв''язку з втратою годувальника: страховий номер померлої застрахованої особи.'
