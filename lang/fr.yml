fr:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Données personnelles'
    'GeneralNotice': 'Par cette demande (formulaire R0820), vous sollicitez auprès de l''Assurance pension allemande (Deutsche Rentenversicherung) une subvention pour votre assurance maladie volontaire ou privée (§ 106 SGB VI). Pour les survivants, une demande distincte doit être faite pour la veuve / le veuf et pour chaque orphelin.'
    'InsuranceNumber': 'Numéro d''assurance (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 caractères, p. ex. 12 150385 M 123. Pour une demande de pension de survivant : numéro d''assurance de l''assuré décédé.'
    'Kennzeichen': 'Code (Kennzeichen, s''il est connu)'
    'LastName': 'Nom'
    'FirstName': 'Prénom'
    'NameSuffix': 'Complément du nom (p. ex. Freifrau, Graf) (facultatif)'
    'NamePrefix': 'Particule (p. ex. von, van, de) (facultatif)'
    'Title': 'Titre (p. ex. Prof. Dr. med.) (facultatif)'
    'BirthName': 'Nom de naissance (facultatif)'
    'BirthDate': 'Date de naissance'
    'Street': 'Rue, numéro'
    'AddressAddition': 'Complément d''adresse (facultatif)'
    'PostalCode': 'Code postal'
    'PostalCodeDescription': 'Veuillez indiquer les codes postaux étrangers de plus de 5 caractères dans le champ Lieu de résidence.'
    'City': 'Lieu de résidence'
    'Country': 'Pays (uniquement en cas de résidence à l''étranger)'
    'Phone': 'Téléphone (facultatif)'
    'Fax': 'Fax (facultatif)'
    'InsuranceNumberInvalid': 'Le numéro d''assurance doit comporter 12 caractères (8 chiffres, 1 lettre, 3 chiffres).'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step2':
    'IntroText': 'Demande déposée par d''autres personnes'
    'FiledByRepresentative': 'La demande est-elle déposée par un représentant ?'
    'FiledByRepresentative.no': 'non'
    'FiledByRepresentative.yes': 'oui'
    'DEFAULT_SELECT': 'Veuillez choisir'
    'RepresentativeNotice': 'Veuillez joindre à la demande la procuration ou la décision du tribunal.'
    'RepresentativeName': 'Nom, prénom / service (le cas échéant, numéro de dossier)'
    'RepresentativeCapacity': 'en qualité de'
    'RepresentativeCapacity.legal': 'représentant légal (gesetzlicher Vertreter)'
    'RepresentativeCapacity.guardian': 'tuteur (Vormund)'
    'RepresentativeCapacity.custodian': 'curateur (Betreuer)'
    'RepresentativeCapacity.authorized': 'mandataire (Bevollmächtigter)'
    'RepresentativeStreet': 'Rue, numéro'
    'RepresentativeAddressAddition': 'Complément d''adresse (facultatif)'
    'RepresentativePostalCode': 'Code postal'
    'RepresentativeCity': 'Lieu de résidence'
    'RepresentativeCountry': 'Pays (uniquement en cas de résidence à l''étranger)'
    'RepresentativePhone': 'Téléphone (facultatif)'
    'RepresentativeFax': 'Fax (facultatif)'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Autre pension'
    'OtherPensionNotice': 'Si vous percevez plusieurs pensions de l''assurance pension légale (par exemple une pension de vieillesse et une pension de survivant), la subvention est calculée sur la somme de ces pensions et versée avec l''une d''elles.'
    'OtherPension': '3.1 Percevez-vous une autre pension de l''assurance pension légale allemande ou une autre pension a-t-elle été demandée ?'
    'OtherPension.no': 'non'
    'OtherPension.yes': 'oui'
    'DEFAULT_SELECT': 'Veuillez choisir'
    'OtherPensionInsurer': 'Organisme d''assurance pension'
    'OtherPensionNumber': 'Numéro d''assurance de l''autre pension (facultatif)'
    'OtherPensionStatus': 'L''autre pension est'
    'OtherPensionStatus.receiving': 'déjà perçue'
    'OtherPensionStatus.applied': 'demandée'
    'OtherPensionSince': 'depuis le'
    'OtherPensionAppliedOn': 'demandée le'
    'OtherPensionSubsidy': '3.2 Une subvention à l''assurance maladie est-elle déjà versée avec l''autre pension ou a-t-elle été demandée ?'
    'OtherPensionSubsidy.no': 'non'
    'OtherPensionSubsidy.yes': 'oui'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Couverture d''assurance maladie existante'
    'StatutoryVoluntary': '4.1 Êtes-vous assuré(e) volontaire auprès d''une caisse d''assurance maladie légale allemande (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft ou caisse d''assurance maladie agricole) ?'
    'StatutoryVoluntary.no': 'non'
    'StatutoryVoluntary.yes': 'oui'
    'DEFAULT_SELECT': 'Veuillez choisir'
    'StatutoryVoluntaryDescription': 'Votre caisse transmet alors elle-même les données nécessaires ; une attestation d''affiliation n''est pas requise.'
    'PrivateInsurance': '4.2 Êtes-vous assuré(e) auprès d''une compagnie allemande d''assurance maladie privée ou membre de la caisse des fonctionnaires des chemins de fer fédéraux (KVB), de la caisse maladie des fonctionnaires de la poste (PBeaKK) ou d''une communauté solidaire reconnue (Solidargemeinschaft) ?'
    'PrivateInsurance.no': 'non'
    'PrivateInsurance.yes': 'oui'
    'R0821Notice': 'Veuillez faire remplir et confirmer le formulaire R0821 par votre compagnie d''assurance, la KVB, la PBeaKK ou votre communauté solidaire.'
    'R0821Status': 'Formulaire R0821'
    'R0821Status.attached': 'est joint'
    'R0821Status.later': 'sera transmis ultérieurement'
    'R0821Status.forwarded': 'a été transmis'
    'ForeignInsurance': '4.3 Êtes-vous assuré(e) volontaire auprès d''une assurance maladie légale étrangère ou d''une compagnie d''assurance maladie privée soumise à la surveillance d''un État membre de l''UE (Royaume-Uni uniquement jusqu''au 31.12.2020), de l''Islande, du Liechtenstein, de la Norvège ou de la Suisse ?'
    'ForeignInsurance.no': 'non'
    'ForeignInsurance.yes': 'oui'
    'R0822Notice': 'Veuillez faire remplir et confirmer le formulaire R0822 par votre compagnie d''assurance.'
    'R0822Status': 'Formulaire R0822'
    'R0822Status.attached': 'est joint'
    'R0822Status.later': 'sera transmis ultérieurement'
    'R0822Status.forwarded': 'a été transmis'
    'MultipleInsurersNotice': 'Si vous êtes assuré(e) auprès de plusieurs compagnies, chacune doit remplir son propre formulaire R0821 ou R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Cotisations pour des membres de la famille'
    'FamilyNotice': 'Les cotisations pour le conjoint, le partenaire enregistré ou les enfants peuvent être prises en compte si le revenu total du membre de la famille ne dépasse pas 1/7 de la valeur de référence mensuelle (2026 : 565 EUR ; en cas d''emploi de faible importance 603 EUR), s''il n''est pas lui-même assuré obligatoire dans une assurance maladie légale allemande ou étrangère et s''il n''a pas lui-même droit, en tant que retraité, à la subvention à l''assurance maladie.'
    'FamilyContributions': '4.4 Les cotisations à une assurance maladie privée pour des membres de la famille doivent-elles être prises en compte ?'
    'FamilyContributions.no': 'non'
    'FamilyContributions.yes': 'oui'
    'DEFAULT_SELECT': 'Veuillez choisir'
    'FamilyFormNotice': 'Veuillez faire inscrire également les cotisations dans le formulaire R0821 / R0822.'
    'FamilyMemberLastName': 'Nom du membre de la famille'
    'FamilyMemberFirstName': 'Prénom'
    'FamilyMemberBirthDate': 'Date de naissance'
    'FamilyMemberRelationship': 'Lien de parenté'
    'FamilyMemberRelationship.spouse': 'Conjoint / conjointe (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Partenaire enregistré(e) (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Enfant (Kind)'
    'FamilyMemberIncome': 'Montant du revenu mensuel total du membre de la famille (EUR)'
    'FamilyMemberIncomeDescription': 'Aucun revenu : veuillez indiquer 0.'
    'FamilyMemberPensioner': '4.4.1 Le membre de la famille est-il retraité ?'
    'FamilyMemberPensioner.no': 'non'
    'FamilyMemberPensioner.yes': 'oui'
    'FamilyMemberPensionInsurer': 'Organisme d''assurance pension'
    'FamilyMemberPensionNumber': 'Numéro d''assurance (facultatif)'
    'FamilyMemberPensionSince': 'Pension depuis le'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Assurance obligatoire et accès aux documents'
    'CompulsoryInsurance': '4.5 Existe-t-il ou existait-il, pendant la période pour laquelle vous demandez la subvention, une assurance obligatoire dans une assurance maladie légale allemande ou étrangère ?'
    'CompulsoryInsurance.no': 'non'
    'CompulsoryInsurance.yes': 'oui'
    'DEFAULT_SELECT': 'Veuillez choisir'
    'CompulsoryInsuranceDescription': 'La subvention n''est pas versée tant que vous êtes assuré(e) obligatoire dans une assurance maladie légale allemande ou étrangère. Indiquez-le également si vous êtes inscrit(e) auprès d''une caisse allemande comme bénéficiaire à la charge d''un autre État de l''UE, de l''Islande, du Liechtenstein, de la Norvège, de la Suisse ou du Royaume-Uni.'
    'CompulsoryInsurer': 'Nom et adresse de la caisse d''assurance maladie ou du service de santé'
    'CompulsoryReason': 'Motif de l''assurance obligatoire'
    'CompulsoryReasonDescription': 'Par exemple relation de travail, assurance obligatoire en tant que chômeur, assurance maladie des résidents.'
    'AccessibilityHeader': 'Accès aux documents pour les personnes malvoyantes'
    'AccessibilityNotice': 'Les personnes handicapées (par exemple aveugles ou malvoyantes) ont le droit de recevoir les documents en plus sous une forme qu''elles peuvent percevoir.'
    'AccessibleFormat': 'Recevoir les documents en plus (facultatif)'
    'AccessibleFormat.large_print': 'en gros caractères'
    'AccessibleFormat.braille_short': 'en braille (abrégé)'
    'AccessibleFormat.braille_full': 'en braille (intégral)'
    'AccessibleFormat.cd': 'sur CD (fichier texte au format ".doc")'
    'AccessibleFormat.daisy': 'en support audio (format CD-DAISY)'
    'AccessibleFormatNone': 'pas nécessaire'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Déclaration du demandeur / de la demandeuse'
    'DeclarationIntro': 'Je certifie avoir fourni toutes les indications de ce formulaire en toute bonne foi. Je sais que des indications sciemment fausses peuvent entraîner des poursuites pénales.'
    'DeclarationDuties': 'Je m''engage à informer immédiatement l''organisme d''assurance pension des faits suivants :'
    'DutyA': 'a) la fin ou la suspension de l''assurance pour laquelle la subvention est versée (par exemple en cas de droit aux soins au titre de la loi fédérale sur l''assistance aux victimes de guerre (Bundesversorgungsgesetz), de la loi fédérale d''indemnisation (Bundesentschädigungsgesetz) ou en cas de séjour à l''étranger),'
    'DutyB': 'b) toute modification du montant de la cotisation ou de la prime de l''assurance maladie privée,'
    'DutyC': 'c) le début d''une assurance obligatoire dans l''assurance maladie légale allemande (par exemple en cas de prise d''emploi, de demande d''une autre pension, de perception d''une indemnité transitoire, d''allocations de chômage ou du revenu minimum / Bürgergeld),'
    'DutyD': 'd) le début d''une assurance obligatoire dans une assurance maladie légale étrangère (par exemple en cas de transfert de résidence à l''étranger, de prise d''emploi à l''étranger ou du début d''une pension étrangère),'
    'DutyE': 'e) l''« inscription » (Einschreibung) comme bénéficiaire auprès d''une caisse d''assurance maladie légale allemande en raison de la pension d''un autre État de l''UE, de l''Islande, du Liechtenstein, de la Norvège, de la Suisse ou du Royaume-Uni,'
    'DutyF': 'f) toute modification de la situation du membre de la famille dont les cotisations sont prises en compte pour la subvention (droit propre à pension, début d''une assurance obligatoire, modification des cotisations ou du revenu total) et'
    'DutyG': 'g) le déménagement dans un autre État.'
    'DeclarationAccepted': 'J''ai lu la déclaration et je la confirme.'
    'BeihilfeNotice': 'Si vous avez droit à la Beihilfe (aide pour fonctionnaires), demandez à votre service Beihilfe si la subvention a une incidence sur votre droit. Vous pouvez renoncer à la subvention ou à une partie de celle-ci pour l''avenir.'
    'Place': 'Lieu'
    'PlaceDescription': 'La date est inscrite automatiquement lors de la création du PDF. Pour les orphelins, le représentant légal signe.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Votre adresse e-mail :'
    'AcceptTerms': 'J''ai lu et j''accepte les <a href="/de/agb" target="_blank">CGV</a> et la <a href="/de/datenschutz" target="_blank">politique de confidentialité</a>.'
    'AcceptNoReturn': 'J''accepte expressément que vous commenciez l''exécution du contrat avant l''expiration du délai de rétractation. Je sais qu''avec ce consentement je perds mon droit de rétractation dès le début de l''exécution du contrat.'
    'SignatureRequired': 'Veuillez signer la demande.'
  'Kalakotra\EFormRenteR0820\Forms\StepTrait':
    'REQUIRED': '« {name} » est obligatoire.'
    'REQUIRED_SUMMARY': 'Veuillez remplir les champs obligatoires suivants : {fields}'
  'Kalakotra\EFormRenteR0820\Forms\Form':
    'SAVE_ERROR': 'Un problème est survenu lors de l''enregistrement de vos données. Veuillez réessayer.'
    'BOOLEAN_YES': 'Oui'
