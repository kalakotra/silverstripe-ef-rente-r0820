    'RepresentativeCapacity.legal': 'законный представитель (gesetzlicher Vertreter)'
    'RepresentativeCapacity.guardian': 'опекун (Vormund)'
    'RepresentativeCapacity.custodian': 'попечитель (Betreuer)'
    'RepresentativeCapacity.authorized': 'уполномоченный (Bevollmächtigter)'
    'RepresentativeStreet': 'Улица, номер дома'
    'RepresentativeAddressAddition': 'Дополнение к адресу (необязательно)'
    'RepresentativePostalCode': 'Почтовый индекс'
    'RepresentativeCity': 'Место жительства'
    'RepresentativeCountry': 'Страна (только при проживании за границей)'
