    'RepresentativeFax': 'Факс (необязательно)'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Другая пенсия'
    'OtherPensionNotice': 'Если вы получаете несколько пенсий из государственного пенсионного страхования (например, пенсию по старости и пенсию по случаю потери кормильца), субсидия рассчитывается из суммы этих пенсий и выплачивается вместе с одной из них.'
    'OtherPension': '3.1 Получаете ли вы другую пенсию из германского государственного пенсионного страхования или подано заявление на другую пенсию?'
    'OtherPension.no': 'нет'
    'OtherPension.yes': 'да'
    'DEFAULT_SELECT': 'Пожалуйста, выберите'
    'OtherPensionInsurer': 'Пенсионный страховщик'
    'OtherPensionNumber': 'Страховой номер другой пенсии (необязательно)'
    'OtherPensionStatus': 'Другая пенсия'
    'OtherPensionStatus.receiving': 'уже выплачивается'
    'OtherPensionStatus.applied': 'запрошена'
    'OtherPensionSince': 'с'
    'OtherPensionAppliedOn': 'заявление подано'
    'OtherPensionSubsidy': '3.2 Выплачивается ли к другой пенсии уже субсидия к медицинскому страхованию или подано заявление на неё?'
    'OtherPensionSubsidy.no': 'нет'
    'OtherPensionSubsidy.yes': 'да'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Существующее медицинское страхование'
    'StatutoryVoluntary': '4.1 Застрахованы ли вы добровольно в германской государственной больничной кассе (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft или сельскохозяйственная больничная касса)?'
    'StatutoryVoluntary.no': 'нет'
    'StatutoryVoluntary.yes': 'да'
    'DEFAULT_SELECT': 'Пожалуйста, выберите'
    'StatutoryVoluntaryDescription': 'В этом случае ваша больничная касса сама передаст необходимые данные; справка о членстве не нужна.'
    'PrivateInsurance': '4.2 Застрахованы ли вы в германской частной страховой компании или являетесь членом кассы медицинского обеспечения федеральных железнодорожных служащих (KVB), больничной кассы почтовых служащих (PBeaKK) или признанного солидарного сообщества (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'нет'
    'PrivateInsurance.yes': 'да'
    'R0821Notice': 'Пожалуйста, попросите вашу страховую компанию, KVB, PBeaKK или ваше солидарное сообщество заполнить и подтвердить формуляр R0821.'
    'R0821Status': 'Формуляр R0821'
    'R0821Status.attached': 'приложен'
    'R0821Status.later': 'будет представлен позже'
    'R0821Status.forwarded': 'переслан'
    'ForeignInsurance': '4.3 Застрахованы ли вы добровольно в иностранном государственном медицинском страховании или в частной страховой компании, находящейся под надзором государства — члена ЕС (Великобритания только до 31.12.2020), Исландии, Лихтенштейна, Норвегии или Швейцарии?'
    'ForeignInsurance.no': 'нет'
    'ForeignInsurance.yes': 'да'
    'R0822Notice': 'Пожалуйста, попросите вашу страховую компанию заполнить и подтвердить формуляр R0822.'
    'R0822Status': 'Формуляр R0822'
    'R0822Status.attached': 'приложен'
    'R0822Status.later': 'будет представлен позже'
    'R0822Status.forwarded': 'переслан'
    'MultipleInsurersNotice': 'Если вы застрахованы в нескольких страховых компаниях, каждая из них должна заполнить свой формуляр R0821 или R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Взносы за членов семьи'
    'FamilyNotice': 'Взносы за супруга, зарегистрированного партнёра или детей могут быть учтены, если общий доход члена семьи не превышает 1/7 ежемесячной базовой величины (2026: 565 EUR; при мини-работе 603 EUR), он сам не застрахован обязательно в германском или иностранном государственном медицинском страховании и как пенсионер сам не имеет права на субсидию к медицинскому страхованию.'
    'FamilyContributions': '4.4 Нужно ли учитывать взносы в частное медицинское страхование за членов семьи?'
    'FamilyContributions.no': 'нет'
    'FamilyContributions.yes': 'да'
    'DEFAULT_SELECT': 'Пожалуйста, выберите'
    'FamilyFormNotice': 'Пожалуйста, попросите внести взносы также в формуляр R0821 / R0822.'
    'FamilyMemberLastName': 'Фамилия члена семьи'
    'FamilyMemberFirstName': 'Имя'
    'FamilyMemberBirthDate': 'Дата рождения'
    'FamilyMemberRelationship': 'Степень родства'
    'FamilyMemberRelationship.spouse': 'Супруг / супруга (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Зарегистрированный партнёр (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Ребёнок (Kind)'
    'FamilyMemberIncome': 'Размер общего ежемесячного дохода члена семьи (EUR)'
    'FamilyMemberIncomeDescription': 'Нет дохода: укажите 0.'
    'FamilyMemberPensioner': '4.4.1 Является ли член семьи пенсионером?'
    'FamilyMemberPensioner.no': 'нет'
    'FamilyMemberPensioner.yes': 'да'
    'FamilyMemberPensionInsurer': 'Пенсионный страховщик'
    'FamilyMemberPensionNumber': 'Страховой номер (необязательно)'
    'FamilyMemberPensionSince': 'Пенсия с'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Обязательное страхование и доступ к документам'
    'CompulsoryInsurance': '4.5 Существует или существовало ли в период, за который вы запрашиваете субсидию, обязательное страхование в германском или иностранном государственном медицинском страховании?'
    'CompulsoryInsurance.no': 'нет'
    'CompulsoryInsurance.yes': 'да'
    'DEFAULT_SELECT': 'Пожалуйста, выберите'
    'CompulsoryInsuranceDescription': 'Субсидия не выплачивается, пока вы обязательно застрахованы в германском или иностранном государственном медицинском страховании. Укажите также, если вы зарегистрированы в германской больничной кассе как получатель услуг за счёт другого государства ЕС, Исландии, Лихтенштейна, Норвегии, Швейцарии или Великобритании.'
    'CompulsoryInsurer': 'Название и адрес больничной кассы или службы здравоохранения'
    'CompulsoryReason': 'Основание обязательного страхования'
    'CompulsoryReasonDescription': 'Например, трудовые отношения, обязательное страхование как безработного, страхование жителей.'
    'AccessibilityHeader': 'Доступ к документам для людей с нарушениями зрения'
    'AccessibilityNotice': 'Люди с инвалидностью (например, слепые или слабовидящие) имеют право дополнительно получать документы в доступной для них форме.'
    'AccessibleFormat': 'Дополнительно получать документы (необязательно)'
    'AccessibleFormat.large_print': 'крупным шрифтом'
    'AccessibleFormat.braille_short': 'шрифтом Брайля (сокращённым)'
    'AccessibleFormat.braille_full': 'шрифтом Брайля (полным)'
    'AccessibleFormat.cd': 'на CD (текстовый файл в формате ".doc")'
    'AccessibleFormat.daisy': 'как аудионоситель (формат CD-DAISY)'
    'AccessibleFormatNone': 'не требуется'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Заявление заявителя'
    'DeclarationIntro': 'Заверяю, что все сведения в этом формуляре я указал(а) насколько мне известно. Мне известно, что заведомо ложные сведения могут повлечь уголовное преследование.'
    'DeclarationDuties': 'Обязуюсь незамедлительно сообщать пенсионному страховщику о следующих обстоятельствах:'
    'DutyA': 'a) прекращение или приостановление страхования, к которому выплачивается субсидия (например, при праве на медицинское обеспечение по Федеральному закону о помощи жертвам войны (Bundesversorgungsgesetz), Федеральному закону о компенсации (Bundesentschädigungsgesetz) или при пребывании за границей),'
    'DutyB': 'b) любое изменение размера взносов или страховой премии частного медицинского страхования,'
    'DutyC': 'c) начало обязательного страхования в германском государственном медицинском страховании (например, при начале работы, подаче заявления на другую пенсию, получении переходного пособия, пособия по безработице или базового пособия / Bürgergeld),'
    'DutyD': 'd) начало обязательного страхования в иностранном государственном медицинском страховании (например, при переезде за границу, начале работы за границей или в связи с началом иностранной пенсии),'
    'DutyE': 'e) «регистрация» (Einschreibung) в качестве получателя услуг в германской государственной больничной кассе на основании пенсии другого государства ЕС, Исландии, Лихтенштейна, Норвегии, Швейцарии или Великобритании,'
    'DutyF': 'f) любое изменение обстоятельств члена семьи, взносы которого учитываются при выплате субсидии (собственное право на пенсию, наступление обязательного страхования, изменение взносов или общего дохода) и'
    'DutyG': 'g) переезд в другое государство.'
    'DeclarationAccepted': 'Я прочитал(а) заявление и подтверждаю его.'
    'BeihilfeNotice': 'Если у вас есть право на Beihilfe (пособие для государственных служащих), спросите в своём отделе Beihilfe, влияет ли субсидия на ваше право. Вы можете отказаться от субсидии или её части на будущее.'
    'Place': 'Место'
    'PlaceDescription': 'Дата вносится автоматически при создании PDF. За сирот подписывает законный представитель.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Ваш адрес электронной почты:'
    'AcceptTerms': 'Я прочитал(а) и принимаю <a href="/de/agb" target="_blank">Общие условия</a> и <a href="/de/datenschutz" target="_blank">Политику конфиденциальности</a>.'
    'AcceptNoReturn': 'Я прямо соглашаюсь с тем, что Вы начнёте исполнение договора до истечения срока отказа. Мне известно, что, давая это согласие, я теряю право на отказ от договора с началом его исполнения.'
    'SignatureRequired': 'Пожалуйста, подпишите заявление.'
  'Kalakotra\EFormRenteR0820\Forms\StepTrait':
    'REQUIRED': 'Поле «{name}» обязательно для заполнения.'
    'REQUIRED_SUMMARY': 'Пожалуйста, заполните следующие обязательные поля: {fields}'
  'Kalakotra\EFormRenteR0820\Forms\Form':
    'SAVE_ERROR': 'При сохранении Ваших данных возникла проблема. Пожалуйста, попробуйте ещё раз.'
    'BOOLEAN_YES': 'Да'
