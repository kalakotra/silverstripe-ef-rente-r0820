ru:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Личные данные'
    'GeneralNotice': 'Этим заявлением (формуляр R0820) вы ходатайствуете перед Германским пенсионным страхованием (Deutsche Rentenversicherung) о субсидии к вашему добровольному или частному медицинскому страхованию (§ 106 SGB VI). Для наследников отдельное заявление подаётся на вдову / вдовца и на каждого сироту.'
    'InsuranceNumber': 'Страховой номер (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 знаков, напр. 12 150385 M 123. При заявлении на пенсию по случаю потери кормильца: страховой номер умершего застрахованного лица.'
    'Kennzeichen': 'Код (Kennzeichen, если известен)'
    'LastName': 'Фамилия'
    'FirstName': 'Имя'
    'NameSuffix': 'Добавление к имени (напр. Freifrau, Graf) (необязательно)'
    'NamePrefix': 'Приставка к фамилии (напр. von, van, de) (необязательно)'
    'Title': 'Титул (напр. Prof. Dr. med.) (необязательно)'
    'BirthName': 'Фамилия при рождении (необязательно)'
    'BirthDate': 'Дата рождения'
    'Street': 'Улица, номер дома'
    'AddressAddition': 'Дополнение к адресу (необязательно)'
    'PostalCode': 'Почтовый индекс'
    'PostalCodeDescription': 'Иностранные почтовые индексы длиной более 5 знаков укажите, пожалуйста, в поле «Место жительства».'
    'City': 'Место жительства'
    'Country': 'Страна (только при проживании за границей)'
    'Phone': 'Телефон (необязательно)'
    'Fax': 'Факс (необязательно)'
    'InsuranceNumberInvalid': 'Страховой номер должен состоять из 12 знаков (8 цифр, 1 буква, 3 цифры).'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step2':
    'IntroText': 'Подача заявления другими лицами'
    'FiledByRepresentative': 'Подаётся ли заявление представителем?'
    'FiledByRepresentative.no': 'нет'
    'FiledByRepresentative.yes': 'да'
    'DEFAULT_SELECT': 'Пожалуйста, выберите'
    'RepresentativeNotice': 'Пожалуйста, приложите к заявлению доверенность или решение суда.'
