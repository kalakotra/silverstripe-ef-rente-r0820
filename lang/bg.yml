bg:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Лични данни'
    'GeneralNotice': 'С това заявление (формуляр R0820) кандидатствате пред Германското пенсионно осигуряване (Deutsche Rentenversicherung) за субсидия за вашето доброволно или частно здравно осигуряване (§ 106 SGB VI). При наследници се подава отделно заявление за вдовицата / вдовеца и за всяко сираче.'
    'InsuranceNumber': 'Осигурителен номер (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 знака, напр. 12 150385 M 123. При заявление за наследствена пенсия: осигурителният номер на починалото осигурено лице.'
    'Kennzeichen': 'Код (Kennzeichen, ако е известен)'
    'LastName': 'Фамилия'
    'FirstName': 'Име'
    'NameSuffix': 'Добавка към името (напр. Freifrau, Graf) (по избор)'
    'NamePrefix': 'Представка към фамилията (напр. von, van, de) (по избор)'
    'Title': 'Титла (напр. Prof. Dr. med.) (по избор)'
    'BirthName': 'Фамилия при раждане (по избор)'
    'BirthDate': 'Дата на раждане'
    'Street': 'Улица, номер'
    'AddressAddition': 'Допълнение към адреса (по избор)'
    'PostalCode': 'Пощенски код'
    'PostalCodeDescription': 'Чуждестранни пощенски кодове с повече от 5 знака моля впишете в полето „Местоживеене“.'
    'City': 'Местоживеене'
    'Country': 'Държава (само при местоживеене в чужбина)'
    'Phone': 'Телефон (по избор)'
    'Fax': 'Факс (по избор)'
    'InsuranceNumberInvalid': 'Осигурителният номер трябва да се състои от 12 знака (8 цифри, 1 буква, 3 цифри).'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step2':
    'IntroText': 'Подаване на заявлението от други лица'
    'FiledByRepresentative': 'Подава ли се заявлението от представител?'
    'FiledByRepresentative.no': 'не'
    'FiledByRepresentative.yes': 'да'
    'DEFAULT_SELECT': 'Моля, изберете'
    'RepresentativeNotice': 'Моля, приложете към заявлението пълномощното или решението на съда.'
    'RepresentativeName': 'Фамилия, име / институция (при необходимост номер на делото)'
    'RepresentativeCapacity': 'в качеството на'
    'RepresentativeCapacity.legal': 'законен представител (gesetzlicher Vertreter)'
    'RepresentativeCapacity.guardian': 'настойник (Vormund)'
    'RepresentativeCapacity.custodian': 'попечител (Betreuer)'
    'RepresentativeCapacity.authorized': 'пълномощник (Bevollmächtigter)'
    'RepresentativeStreet': 'Улица, номер'
    'RepresentativeAddressAddition': 'Допълнение към адреса (по избор)'
    'RepresentativePostalCode': 'Пощенски код'
    'RepresentativeCity': 'Местоживеене'
    'RepresentativeCountry': 'Държава (само при местоживеене в чужбина)'
    'RepresentativePhone': 'Телефон (по избор)'
    'RepresentativeFax': 'Факс (по избор)'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Друга пенсия'
    'OtherPensionNotice': 'Ако получавате няколко пенсии от държавното пенсионно осигуряване (например пенсия за осигурителен стаж и възраст и наследствена пенсия), субсидията се изчислява от сбора на тези пенсии и се изплаща заедно с една от тях.'
    'OtherPension': '3.1 Получавате ли друга пенсия от германското държавно пенсионно осигуряване или е подадено заявление за друга пенсия?'
    'OtherPension.no': 'не'
    'OtherPension.yes': 'да'
    'DEFAULT_SELECT': 'Моля, изберете'
    'OtherPensionInsurer': 'Пенсионен осигурител'
    'OtherPensionNumber': 'Осигурителен номер на другата пенсия (по избор)'
    'OtherPensionStatus': 'Другата пенсия'
    'OtherPensionStatus.receiving': 'вече се получава'
    'OtherPensionStatus.applied': 'е заявена'
    'OtherPensionSince': 'от'
    'OtherPensionAppliedOn': 'заявена на'
    'OtherPensionSubsidy': '3.2 Изплаща ли се към другата пенсия вече субсидия за здравно осигуряване или е подадено заявление за нея?'
    'OtherPensionSubsidy.no': 'не'
    'OtherPensionSubsidy.yes': 'да'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Съществуващо здравно осигуряване'
    'StatutoryVoluntary': '4.1 Доброволно осигурени ли сте в германска държавна здравноосигурителна каса (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft или земеделска здравноосигурителна каса)?'
    'StatutoryVoluntary.no': 'не'
    'StatutoryVoluntary.yes': 'да'
    'DEFAULT_SELECT': 'Моля, изберете'
    'StatutoryVoluntaryDescription': 'В този случай вашата здравноосигурителна каса сама предава необходимите данни; удостоверение за членство не е нужно.'
    'PrivateInsurance': '4.2 Осигурени ли сте в германско частно здравноосигурително дружество или сте член на здравната каса на федералните железопътни служители (KVB), на здравноосигурителната каса на пощенските служители (PBeaKK) или на призната солидарна общност (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'не'
    'PrivateInsurance.yes': 'да'
    'R0821Notice': 'Моля, помолете вашето осигурително дружество, KVB, PBeaKK или вашата солидарна общност да попълни и потвърди формуляр R0821.'
    'R0821Status': 'Формуляр R0821'
    'R0821Status.attached': 'е приложен'
    'R0821Status.later': 'ще бъде представен допълнително'
    'R0821Status.forwarded': 'е препратен'
    'ForeignInsurance': '4.3 Доброволно осигурени ли сте в чуждестранно държавно здравно осигуряване или в частно здравноосигурително дружество под надзора на държава членка на ЕС (Обединеното кралство само до 31.12.2020), Исландия, Лихтенщайн, Норвегия или Швейцария?'
    'ForeignInsurance.no': 'не'
    'ForeignInsurance.yes': 'да'
    'R0822Notice': 'Моля, помолете вашето осигурително дружество да попълни и потвърди формуляр R0822.'
    'R0822Status': 'Формуляр R0822'
    'R0822Status.attached': 'е приложен'
    'R0822Status.later': 'ще бъде представен допълнително'
    'R0822Status.forwarded': 'е препратен'
    'MultipleInsurersNotice': 'Ако сте здравно осигурени в няколко дружества, всяко от тях трябва да попълни собствен формуляр R0821 или R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Вноски за членове на семейството'
    'FamilyNotice': 'Вноските за съпруг, регистриран партньор или деца могат да бъдат взети предвид, ако общият доход на члена на семейството не надвишава 1/7 от месечната референтна стойност (2026: 565 EUR; при незначителна заетост 603 EUR), той самият не е задължително осигурен в германско или чуждестранно държавно здравно осигуряване и като пенсионер няма собствено право на субсидия за здравно осигуряване.'
    'FamilyContributions': '4.4 Трябва ли да се вземат предвид вноските за частно здравно осигуряване на членове на семейството?'
    'FamilyContributions.no': 'не'
    'FamilyContributions.yes': 'да'
    'DEFAULT_SELECT': 'Моля, изберете'
    'FamilyFormNotice': 'Моля, вноските да бъдат вписани и във формуляр R0821 / R0822.'
    'FamilyMemberLastName': 'Фамилия на члена на семейството'
    'FamilyMemberFirstName': 'Име'
    'FamilyMemberBirthDate': 'Дата на раждане'
    'FamilyMemberRelationship': 'Родствена връзка'
    'FamilyMemberRelationship.spouse': 'Съпруг / съпруга (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Регистриран партньор (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Дете (Kind)'
    'FamilyMemberIncome': 'Размер на общия месечен доход на члена на семейството (EUR)'
    'FamilyMemberIncomeDescription': 'Без доход: моля въведете 0.'
    'FamilyMemberPensioner': '4.4.1 Пенсионер ли е членът на семейството?'
    'FamilyMemberPensioner.no': 'не'
    'FamilyMemberPensioner.yes': 'да'
    'FamilyMemberPensionInsurer': 'Пенсионен осигурител'
    'FamilyMemberPensionNumber': 'Осигурителен номер (по избор)'
    'FamilyMemberPensionSince': 'Пенсия от'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Задължително осигуряване и достъп до документи'
    'CompulsoryInsurance': '4.5 Съществува ли или съществувало ли е през периода, за който кандидатствате за субсидия, задължително осигуряване в германско или чуждестранно държавно здравно осигуряване?'
    'CompulsoryInsurance.no': 'не'
    'CompulsoryInsurance.yes': 'да'
    'DEFAULT_SELECT': 'Моля, изберете'
    'CompulsoryInsuranceDescription': 'Субсидията не се изплаща, докато сте задължително осигурени в германско или чуждестранно държавно здравно осигуряване. Моля, посочете също, ако сте регистрирани в германска здравноосигурителна каса като правоимащ за сметка на друга държава от ЕС, Исландия, Лихтенщайн, Норвегия, Швейцария или Обединеното кралство.'
    'CompulsoryInsurer': 'Наименование и адрес на здравноосигурителната каса или здравната служба'
    'CompulsoryReason': 'Основание за задължителното осигуряване'
    'CompulsoryReasonDescription': 'Например трудово правоотношение, задължително осигуряване като безработен, здравно осигуряване на жителите.'
    'AccessibilityHeader': 'Достъп до документи за хора със зрителни увреждания'
    'AccessibilityNotice': 'Хората с увреждания (например слепи или слабовиждащи) имат право да получават документите допълнително във форма, която могат да възприемат.'
    'AccessibleFormat': 'Допълнително получаване на документи (по избор)'
    'AccessibleFormat.large_print': 'с едър шрифт'
    'AccessibleFormat.braille_short': 'на Брайлов шрифт (съкратен)'
    'AccessibleFormat.braille_full': 'на Брайлов шрифт (пълен)'
    'AccessibleFormat.cd': 'на CD (текстов файл във формат ".doc")'
    'AccessibleFormat.daisy': 'като аудионосител (формат CD-DAISY)'
    'AccessibleFormatNone': 'не е необходимо'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Декларация на заявителя'
    'DeclarationIntro': 'Декларирам, че съм посочил(а) всички данни в този формуляр според най-доброто си знание. Известно ми е, че съзнателно неверни данни могат да доведат до наказателно преследване.'
    'DeclarationDuties': 'Задължавам се незабавно да уведомявам пенсионния осигурител за следните обстоятелства:'
    'DutyA': 'a) прекратяване или спиране на осигуряването, към което се изплаща субсидията (например при право на здравни грижи по Федералния закон за обезпечаване на жертвите на войната (Bundesversorgungsgesetz), Федералния закон за обезщетенията (Bundesentschädigungsgesetz) или при престой в чужбина),'
    'DutyB': 'b) всяка промяна в размера на вноската или премията за частното здравно осигуряване,'
    'DutyC': 'c) началото на задължително осигуряване в германското държавно здравно осигуряване (например при започване на работа, при заявление за друга пенсия, при получаване на преходно обезщетение, обезщетение за безработица или базово подпомагане / Bürgergeld),'
    'DutyD': 'd) началото на задължително осигуряване в чуждестранно държавно здравно осигуряване (например при преместване в чужбина, при започване на работа в чужбина или поради начало на чуждестранна пенсия),'
    'DutyE': 'e) „регистрацията“ (Einschreibung) като правоимащ в германска държавна здравноосигурителна каса въз основа на пенсия от друга държава от ЕС, Исландия, Лихтенщайн, Норвегия, Швейцария или Обединеното кралство,'
    'DutyF': 'f) всяка промяна в обстоятелствата на члена на семейството, чиито вноски се вземат предвид при субсидията (собствено право на пенсия, възникване на задължително осигуряване, промени във вноските или общия доход) и'
    'DutyG': 'g) преместване в друга държава.'
    'DeclarationAccepted': 'Прочетох декларацията и я потвърждавам.'
    'BeihilfeNotice': 'Ако имате право на Beihilfe (помощ за държавни служители), попитайте вашата служба за Beihilfe дали субсидията влияе на правото ви. Можете да се откажете от субсидията или от част от нея за в бъдеще.'
    'Place': 'Място'
    'PlaceDescription': 'Датата се вписва автоматично при създаване на PDF. За сирачета подписва законният представител.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Вашият имейл адрес:'
    'AcceptTerms': 'Прочетох и приемам <a href="/de/agb" target="_blank">Общите условия</a> и <a href="/de/datenschutz" target="_blank">Политиката за поверителност</a>.'
    'AcceptNoReturn': 'Изрично се съгласявам да започнете изпълнението на договора преди изтичането на срока за отказ. Известно ми е, че с това съгласие губя правото си на отказ с началото на изпълнението на договора.'
    'SignatureRequired': 'Моля, подпишете заявлението.'
  'Kalakotra\EFormRenteR0820\Forms\StepTrait':
    'REQUIRED': 'Полето „{name}“ е задължително.'
    'REQUIRED_SUMMARY': 'Моля, попълнете следните задължителни полета: {fields}'
  'Kalakotra\EFormRenteR0820\Forms\Form':
    'SAVE_ERROR': 'Възникна проблем при запазването на данните Ви. Моля, опитайте отново.'
    'BOOLEAN_YES': 'Да'
