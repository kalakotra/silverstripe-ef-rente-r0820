    'OtherPensionSubsidy.yes': 'da'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Asigurarea de sănătate existentă'
    'StatutoryVoluntary': '4.1 Sunteți asigurat voluntar la o casă de asigurări de sănătate legală germană (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft sau casa de asigurări de sănătate agricolă)?'
    'StatutoryVoluntary.no': 'nu'
    'StatutoryVoluntary.yes': 'da'
    'DEFAULT_SELECT': 'Vă rugăm să selectați'
    'StatutoryVoluntaryDescription': 'În acest caz, casa dumneavoastră de asigurări transmite ea însăși datele necesare; nu este nevoie de o adeverință de membru.'
    'PrivateInsurance': '4.2 Sunteți asigurat la o societate germană de asigurări private de sănătate sau sunteți membru al casei de asistență medicală a funcționarilor căilor ferate federale (KVB), al casei de asigurări a funcționarilor poștali (PBeaKK) sau al unei comunități solidare recunoscute (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'nu'
    'PrivateInsurance.yes': 'da'
    'R0821Notice': 'Vă rugăm să solicitați societății de asigurare, KVB, PBeaKK sau comunității solidare să completeze și să confirme formularul R0821.'
    'R0821Status': 'Formularul R0821'
    'R0821Status.attached': 'este anexat'
    'R0821Status.later': 'va fi depus ulterior'
    'R0821Status.forwarded': 'a fost transmis'
    'ForeignInsurance': '4.3 Sunteți asigurat voluntar la o asigurare de sănătate legală străină sau la o societate de asigurări private de sănătate aflată sub supravegherea unui stat membru al UE (Regatul Unit doar până la 31.12.2020), a Islandei, Liechtensteinului, Norvegiei sau Elveției?'
    'ForeignInsurance.no': 'nu'
    'ForeignInsurance.yes': 'da'
    'R0822Notice': 'Vă rugăm să solicitați societății de asigurare să completeze și să confirme formularul R0822.'
    'R0822Status': 'Formularul R0822'
    'R0822Status.attached': 'este anexat'
    'R0822Status.later': 'va fi depus ulterior'
    'R0822Status.forwarded': 'a fost transmis'
    'MultipleInsurersNotice': 'Dacă sunteți asigurat la mai multe societăți, fiecare trebuie să completeze propriul formular R0821 sau R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Contribuții pentru membrii familiei'
    'FamilyNotice': 'Contribuțiile pentru soț/soție, partenerul înregistrat sau copii pot fi luate în considerare dacă venitul total al membrului familiei nu depășește 1/7 din valoarea de referință lunară (2026: 565 EUR; la angajare de mică amploare 603 EUR), dacă acesta nu este el însuși asigurat obligatoriu într-o asigurare de sănătate legală germană sau străină și dacă, în calitate de pensionar, nu are el însuși dreptul la subvenția pentru asigurarea de sănătate.'
    'FamilyContributions': '4.4 Trebuie luate în considerare contribuțiile la o asigurare privată de sănătate pentru membrii familiei?'
    'FamilyContributions.no': 'nu'
    'FamilyContributions.yes': 'da'
    'DEFAULT_SELECT': 'Vă rugăm să selectați'
    'FamilyFormNotice': 'Vă rugăm să cereți înscrierea contribuțiilor și în formularul R0821 / R0822.'
    'FamilyMemberLastName': 'Numele membrului familiei'
    'FamilyMemberFirstName': 'Prenume'
    'FamilyMemberBirthDate': 'Data nașterii'
    'FamilyMemberRelationship': 'Grad de rudenie'
    'FamilyMemberRelationship.spouse': 'Soț / soție (Ehegatte / Ehegattin)'
    'FamilyMemberRelationship.partner': 'Partener înregistrat (Lebenspartner / Lebenspartnerin)'
    'FamilyMemberRelationship.child': 'Copil (Kind)'
    'FamilyMemberIncome': 'Valoarea venitului lunar total al membrului familiei (EUR)'
    'FamilyMemberIncomeDescription': 'Fără venit: introduceți 0.'
    'FamilyMemberPensioner': '4.4.1 Membrul familiei este pensionar?'
    'FamilyMemberPensioner.no': 'nu'
    'FamilyMemberPensioner.yes': 'da'
    'FamilyMemberPensionInsurer': 'Instituția de asigurare de pensii'
    'FamilyMemberPensionNumber': 'Număr de asigurare (opțional)'
    'FamilyMemberPensionSince': 'Pensie din'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Asigurare obligatorie și acces la documente'
    'CompulsoryInsurance': '4.5 În perioada pentru care solicitați subvenția, există sau a existat obligația de asigurare într-o asigurare de sănătate legală germană sau străină?'
    'CompulsoryInsurance.no': 'nu'
    'CompulsoryInsurance.yes': 'da'
    'DEFAULT_SELECT': 'Vă rugăm să selectați'
    'CompulsoryInsuranceDescription': 'Subvenția nu se plătește cât timp sunteți asigurat obligatoriu într-o asigurare de sănătate legală germană sau străină. Menționați și dacă sunteți înscris la o casă de asigurări germană ca beneficiar pe seama unui alt stat al UE, a Islandei, Liechtensteinului, Norvegiei, Elveției sau Regatului Unit.'
    'CompulsoryInsurer': 'Denumirea și adresa casei de asigurări de sănătate sau a serviciului de sănătate'
    'CompulsoryReason': 'Motivul asigurării obligatorii'
    'CompulsoryReasonDescription': 'De exemplu raport de muncă, asigurare obligatorie ca șomer, asigurare de sănătate a rezidenților.'
    'AccessibilityHeader': 'Acces la documente pentru persoane cu deficiențe de vedere'
    'AccessibilityNotice': 'Persoanele cu dizabilități (de exemplu nevăzătoare sau cu deficiențe de vedere) au dreptul să primească documentele suplimentar într-o formă perceptibilă pentru ele.'
    'AccessibleFormat': 'Primirea suplimentară a documentelor (opțional)'
    'AccessibleFormat.large_print': 'cu litere mari'
    'AccessibleFormat.braille_short': 'în Braille (prescurtat)'
    'AccessibleFormat.braille_full': 'în Braille (integral)'
    'AccessibleFormat.cd': 'pe CD (fișier text în format ".doc")'
    'AccessibleFormat.daisy': 'ca suport audio (format CD-DAISY)'
    'AccessibleFormatNone': 'nu este necesar'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Declarația solicitantului'
    'DeclarationIntro': 'Declar că toate datele din acest formular le-am furnizat după cunoștințele mele cele mai bune. Știu că datele false furnizate cu bună știință pot duce la urmărire penală.'
    'DeclarationDuties': 'Mă oblig să comunic imediat instituției de asigurare de pensii următoarele situații:'
    'DutyA': 'a) încetarea sau suspendarea asigurării pentru care se plătește subvenția (de exemplu în cazul dreptului la asistență medicală conform Legii federale privind asistența victimelor războiului (Bundesversorgungsgesetz), Legii federale privind despăgubirile (Bundesentschädigungsgesetz) sau în cazul șederii în străinătate),'
    'DutyB': 'b) orice modificare a cuantumului contribuției sau primei asigurării private de sănătate,'
    'DutyC': 'c) începerea asigurării obligatorii în asigurarea de sănătate legală germană (de exemplu prin începerea unui loc de muncă, prin cererea unei alte pensii, prin primirea indemnizației de tranziție, a ajutorului de șomaj sau a venitului de bază / Bürgergeld),'
    'DutyD': 'd) începerea asigurării obligatorii într-o asigurare de sănătate legală străină (de exemplu la mutarea domiciliului în străinătate, la începerea unui loc de muncă în străinătate sau ca urmare a începerii unei pensii străine),'
    'DutyE': 'e) „înscrierea” (Einschreibung) ca beneficiar la o casă de asigurări de sănătate legală germană în baza pensiei unui alt stat al UE, a Islandei, Liechtensteinului, Norvegiei, Elveției sau Regatului Unit,'
    'DutyF': 'f) orice modificare a situației membrului familiei ale cărui contribuții sunt luate în considerare la subvenție (drept propriu la pensie, începerea asigurării obligatorii, modificări ale contribuțiilor sau ale venitului total) și'
    'DutyG': 'g) mutarea într-un alt stat.'
    'DeclarationAccepted': 'Am citit declarația și o confirm.'
    'BeihilfeNotice': 'Dacă aveți dreptul la Beihilfe (ajutor pentru funcționari publici), întrebați serviciul Beihilfe dacă subvenția vă afectează dreptul. Puteți renunța la subvenție sau la o parte din ea cu efect pentru viitor.'
    'Place': 'Localitate'
    'PlaceDescription': 'Data se completează automat la crearea PDF-ului. Pentru orfani semnează reprezentantul legal.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Adresa dumneavoastră de e-mail:'
    'AcceptTerms': 'Am citit și accept <a href="/de/agb" target="_blank">termenii și condițiile</a> și <a href="/de/datenschutz" target="_blank">politica de confidențialitate</a>.'
    'AcceptNoReturn': 'Sunt de acord în mod expres ca dumneavoastră să începeți executarea contractului înainte de expirarea termenului de retragere. Știu că, prin acest acord, îmi pierd dreptul de retragere odată cu începerea executării contractului.'
    'SignatureRequired': 'Vă rugăm să semnați cererea.'
