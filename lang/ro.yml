    'GeneralNotice': 'Prin această cerere (formularul R0820) solicitați Asigurării de pensii germane (Deutsche Rentenversicherung) o subvenție pentru asigurarea dumneavoastră de sănătate voluntară sau privată (§ 106 SGB VI). În cazul urmașilor, se depune câte o cerere separată pentru văduvă / văduv și pentru fiecare orfan.'
    'InsuranceNumber': 'Număr de asigurare (Versicherungsnummer)'
    'InsuranceNumberDescription': '12 caractere, de ex. 12 150385 M 123. La cererea de pensie de urmaș: numărul de asigurare al asiguratului decedat.'
