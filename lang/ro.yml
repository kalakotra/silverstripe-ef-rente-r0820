  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Altă pensie'
    'OtherPensionNotice': 'Dacă primiți mai multe pensii din asigurarea de pensii legală (de exemplu pensie pentru limită de vârstă și pensie de urmaș), subvenția se calculează din suma acestor pensii și se plătește împreună cu una dintre ele.'
    'OtherPension': '3.1 Primiți o altă pensie din asigurarea de pensii legală germană sau a fost solicitată o altă pensie?'
    'OtherPension.no': 'nu'
