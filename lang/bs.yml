    'OtherPensionStatus': 'Druga penzija se'
    'OtherPensionStatus.receiving': 'već prima'
    'OtherPensionStatus.applied': 'zatražena je'
    'OtherPensionSince': 'od'
    'OtherPensionAppliedOn': 'zatražena dana'
    'OtherPensionSubsidy': '3.2 Isplaćuje li se uz drugu penziju već doprinos za zdravstveno osiguranje ili je on zatražen?'
    'OtherPensionSubsidy.no': 'ne'
    'OtherPensionSubsidy.yes': 'da'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Postojeće zdravstveno osiguranje'
    'StatutoryVoluntary': '4.1 Jeste li dobrovoljno osigurani kod njemačke zakonske zdravstvene blagajne (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft ili poljoprivredna zdravstvena blagajna)?'
    'StatutoryVoluntary.no': 'ne'
    'StatutoryVoluntary.yes': 'da'
    'DEFAULT_SELECT': 'Molimo odaberite'
    'StatutoryVoluntaryDescription': 'Vaša zdravstvena blagajna tada sama dostavlja potrebne podatke; potvrda o članstvu nije potrebna.'
    'PrivateInsurance': '4.2 Jeste li osigurani kod njemačkog privatnog zdravstvenog osiguravača odnosno član zdravstvenog fonda službenika savezne željeznice (KVB), zdravstvene blagajne poštanskih službenika (PBeaKK) ili priznate solidarne zajednice (Solidargemeinschaft)?'
    'PrivateInsurance.no': 'ne'
    'PrivateInsurance.yes': 'da'
    'R0821Notice': 'Molimo da Vaš osiguravač, KVB, PBeaKK odnosno Vaša solidarna zajednica popuni i potvrdi obrazac R0821.'
    'R0821Status': 'Obrazac R0821'
    'R0821Status.attached': 'je priložen'
    'R0821Status.later': 'bit će naknadno dostavljen'
    'R0821Status.forwarded': 'je proslijeđen'
    'ForeignInsurance': '4.3 Jeste li dobrovoljno osigurani kod stranog zakonskog zdravstvenog osiguranja ili kod privatnog zdravstvenog osiguravača koji je pod nadzorom države članice EU (Ujedinjeno Kraljevstvo samo do 31.12.2020), Islanda, Lihtenštajna, Norveške ili Švicarske?'
    'ForeignInsurance.no': 'ne'
    'ForeignInsurance.yes': 'da'
    'R0822Notice': 'Molimo da Vaš osiguravač popuni i potvrdi obrazac R0822.'
    'R0822Status': 'Obrazac R0822'
    'R0822Status.attached': 'je priložen'
    'R0822Status.later': 'bit će naknadno dostavljen'
    'R0822Status.forwarded': 'je proslijeđen'
    'MultipleInsurersNotice': 'Ako ste zdravstveno osigurani kod više osiguravača, svaki od njih mora popuniti po jedan obrazac R0821 odnosno R0822.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Doprinosi za članove porodice'
    'FamilyNotice': 'Doprinosi za bračnog druga, životnog partnera ili djecu mogu se uzeti u obzir ako ukupni prihod člana porodice ne prelazi 1/7 mjesečne referentne veličine (2026: 565 EUR; kod male zaposlenosti 603 EUR), ako on sam nije obavezno osiguran u njemačkom ili stranom zakonskom zdravstvenom osiguranju i ako kao penzioner nema sam pravo na doprinos za zdravstveno osiguranje.'
    'FamilyContributions': '4.4 Trebaju li se uzeti u obzir doprinosi za privatno zdravstveno osiguranje članova porodice?'
    'FamilyContributions.no': 'ne'
    'FamilyContributions.yes': 'da'
    'DEFAULT_SELECT': 'Molimo odaberite'
    'FamilyFormNotice': 'Molimo da se doprinosi upišu i u obrazac R0821 / R0822.'
    'FamilyMemberLastName': 'Prezime člana porodice'
    'FamilyMemberFirstName': 'Ime'
    'FamilyMemberBirthDate': 'Datum rođenja'
    'FamilyMemberRelationship': 'Srodstvo'
