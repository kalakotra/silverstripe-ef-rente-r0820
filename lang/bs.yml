    'FamilyMemberPensionInsurer': 'Nosilac penzionog osiguranja'
    'FamilyMemberPensionNumber': 'Broj osiguranja (opcionalno)'
    'FamilyMemberPensionSince': 'Penzija od'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Obavezno osiguranje i pristup dokumentima'
    'CompulsoryInsurance': '4.5 Postoji li ili je postojalo u periodu za koji tražite doprinos obavezno osiguranje u njemačkom ili stranom zakonskom zdravstvenom osiguranju?'
    'CompulsoryInsurance.no': 'ne'
    'CompulsoryInsurance.yes': 'da'
    'DEFAULT_SELECT': 'Molimo odaberite'
    'CompulsoryInsuranceDescription': 'Doprinos se ne isplaćuje dok ste obavezno osigurani u njemačkom ili stranom zakonskom zdravstvenom osiguranju. Navedite i ako ste na teret druge države EU, Islanda, Lihtenštajna, Norveške, Švicarske ili Ujedinjenog Kraljevstva upisani kod njemačke zdravstvene blagajne kao korisnik prava.'
    'CompulsoryInsurer': 'Naziv i adresa zdravstvene blagajne ili zdravstvene službe'
    'CompulsoryReason': 'Razlog obaveznog osiguranja'
    'CompulsoryReasonDescription': 'Npr. radni odnos, obavezno osiguranje kao nezaposlena osoba, zdravstveno osiguranje stanovnika.'
    'AccessibilityHeader': 'Pristup dokumentima za slabovidne osobe'
    'AccessibilityNotice': 'Osobe s invaliditetom (npr. slijepe ili slabovidne osobe) imaju pravo da dokumente dodatno dobiju u obliku koji mogu percipirati.'
    'AccessibleFormat': 'Dodatno primati dokumente (opcionalno)'
    'AccessibleFormat.large_print': 'krupnim slovima'
    'AccessibleFormat.braille_short': 'na Brajevom pismu (skraćeno)'
    'AccessibleFormat.braille_full': 'na Brajevom pismu (puno)'
    'AccessibleFormat.cd': 'na CD-u (tekstualna datoteka u ".doc" formatu)'
    'AccessibleFormat.daisy': 'kao audio medij (CD-DAISY format)'
    'AccessibleFormatNone': 'nije potrebno'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Izjava podnosioca zahtjeva'
    'DeclarationIntro': 'Izjavljujem da sam sve podatke u ovom obrascu dao/dala po svom najboljem znanju. Poznato mi je da svjesno netačni podaci mogu dovesti do krivičnog gonjenja.'
    'DeclarationDuties': 'Obavezujem se da ću nosiocu penzionog osiguranja odmah prijaviti sljedeće činjenice:'
    'DutyA': 'a) prestanak ili mirovanje osiguranja za koje se isplaćuje doprinos (npr. kod prava na zdravstvenu zaštitu po Saveznom zakonu o zbrinjavanju žrtava rata (Bundesversorgungsgesetz), Saveznom zakonu o obeštećenju (Bundesentschädigungsgesetz) ili kod boravka u inostranstvu),'
    'DutyB': 'b) svaku promjenu visine doprinosa ili premije za privatno zdravstveno osiguranje,'
    'DutyC': 'c) početak obaveznog osiguranja u njemačkom zakonskom zdravstvenom osiguranju (npr. zasnivanjem radnog odnosa, zahtjevom za drugu penziju, primanjem prelazne naknade, naknade za nezaposlenost ili osnovne socijalne pomoći / Bürgergeld),'
    'DutyD': 'd) početak obaveznog osiguranja u stranom zakonskom zdravstvenom osiguranju (npr. preseljenjem u inostranstvo, zaposlenjem u inostranstvu ili zbog početka strane penzije),'
    'DutyE': 'e) "upis" (Einschreibung) kao korisnika prava kod njemačke zakonske zdravstvene blagajne na osnovu penzije druge države EU, Islanda, Lihtenštajna, Norveške, Švicarske ili Ujedinjenog Kraljevstva,'
    'DutyF': 'f) svaku promjenu u prilikama člana porodice čiji se doprinosi uzimaju u obzir pri isplati doprinosa (vlastito pravo na penziju, nastanak obaveznog osiguranja, promjene doprinosa ili ukupnog prihoda) i'
    'DutyG': 'g) preseljenje u drugu državu.'
    'DeclarationAccepted': 'Pročitao/la sam izjavu i potvrđujem je.'
    'BeihilfeNotice': 'Ako imate pravo na Beihilfe (pomoć za državne službenike), pitajte svoju službu za Beihilfe da li doprinos utiče na Vaše pravo. Možete se odreći doprinosa ili njegovog dijela s djelovanjem za ubuduće.'
    'Place': 'Mjesto'
    'PlaceDescription': 'Datum se automatski upisuje pri izradi PDF-a. Za djecu bez roditelja potpisuje zakonski zastupnik.'
