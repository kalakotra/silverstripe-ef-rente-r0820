  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Druga penzija'
    'OtherPensionNotice': 'Ako primate više penzija iz zakonskog penzionog osiguranja (npr. starosnu i porodičnu penziju), doprinos se obračunava iz zbira tih penzija i isplaćuje uz jednu od njih.'
    'OtherPension': '3.1 Primate li još jednu penziju iz njemačkog zakonskog penzionog osiguranja ili je zatražena još jedna penzija?'
    'OtherPension.no': 'ne'
    'OtherPension.yes': 'da'
    'DEFAULT_SELECT': 'Molimo odaberite'
    'OtherPensionInsurer': 'Nosilac penzionog osiguranja'
