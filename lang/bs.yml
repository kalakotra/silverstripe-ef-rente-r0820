    'AcceptNoReturn': 'Izričito pristajem da počnete s izvršenjem ugovora prije isteka roka za odustanak. Svjestan/na sam da ovim pristankom gubim pravo na odustanak od početka izvršenja ugovora.'
    'SignatureRequired': 'Molimo potpišite zahtjev.'
