de:
  'Kalakotra\EFormRenteR0820\Forms\Form_Step1':
    'IntroText': 'Angaben zur Person'
    'GeneralNotice': 'Mit diesem Antrag (Vordruck R0820) beantragen Sie bei der Deutschen Rentenversicherung einen Zuschuss zu Ihrer freiwilligen oder privaten Krankenversicherung (§ 106 SGB VI). Bei Hinterbliebenen ist für die Witwe / den Witwer und für jede Waise jeweils ein eigener Antrag zu stellen.'
    'InsuranceNumber': 'Versicherungsnummer'
    'InsuranceNumberDescription': '12 Zeichen, z. B. 12 150385 M 123. Bei Antrag auf Hinterbliebenenrente: Versicherungsnummer der / des verstorbenen Versicherten.'
    'Kennzeichen': 'Kennzeichen (soweit bekannt)'
    'LastName': 'Name'
    'FirstName': 'Vorname'
    'NameSuffix': 'Namenszusatz (z. B. Freifrau, Graf) (optional)'
    'NamePrefix': 'Vorsatzworte zum Namen (z. B. von, van, de) (optional)'
    'Title': 'Titel (z. B. Prof. Dr. med.) (optional)'
    'BirthName': 'Geburtsname (optional)'
    'BirthDate': 'Geburtsdatum'
    'Street': 'Straße, Hausnummer'
    'AddressAddition': 'Adresszusatz (optional)'
    'PostalCode': 'Postleitzahl'
    'PostalCodeDescription': 'Ausländische Postleitzahlen mit mehr als 5 Zeichen bitte im Feld Wohnort eintragen.'
    'City': 'Wohnort'
    'Country': 'Land (nur bei Wohnsitz im Ausland)'
    'Phone': 'Telefon (optional)'
    'Fax': 'Telefax (optional)'
    'InsuranceNumberInvalid': 'Die Versicherungsnummer muss aus 12 Zeichen bestehen (8 Ziffern, 1 Buchstabe, 3 Ziffern).'
