  'Kalakotra\EFormRenteR0820\Forms\Form_Step3':
    'IntroText': 'Weiterer Rentenbezug'
    'OtherPensionNotice': 'Beziehen Sie mehrere Renten der gesetzlichen Rentenversicherung (zum Beispiel Rente wegen Alters und Hinterbliebenenrente), wird der Zuschuss aus der Summe dieser Renten berechnet und zu einer dieser Renten gezahlt.'
    'OtherPension': '3.1 Beziehen Sie eine weitere Rente aus der deutschen gesetzlichen Rentenversicherung oder ist eine weitere Rente beantragt?'
    'OtherPension.no': 'nein'
    'OtherPension.yes': 'ja'
    'DEFAULT_SELECT': 'Bitte auswählen'
    'OtherPensionInsurer': 'Rentenversicherungsträger'
    'OtherPensionNumber': 'Versicherungsnummer der weiteren Rente (optional)'
    'OtherPensionStatus': 'Die weitere Rente wird'
    'OtherPensionStatus.receiving': 'bereits bezogen'
    'OtherPensionStatus.applied': 'ist beantragt'
    'OtherPensionSince': 'seit'
    'OtherPensionAppliedOn': 'beantragt am'
    'OtherPensionSubsidy': '3.2 Wird zu der weiteren Rente bereits ein Zuschuss zur Krankenversicherung gezahlt oder ist dieser beantragt?'
    'OtherPensionSubsidy.no': 'nein'
    'OtherPensionSubsidy.yes': 'ja'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step4':
    'IntroText': 'Bestehender Krankenversicherungsschutz'
    'StatutoryVoluntary': '4.1 Sind Sie freiwillig bei einer deutschen gesetzlichen Krankenkasse (AOK, Ersatzkasse, Betriebskrankenkasse, Innungskrankenkasse, Knappschaft oder landwirtschaftliche Krankenkasse) versichert?'
    'StatutoryVoluntary.no': 'nein'
    'StatutoryVoluntary.yes': 'ja'
    'DEFAULT_SELECT': 'Bitte auswählen'
    'StatutoryVoluntaryDescription': 'Ihre Krankenkasse übermittelt die erforderlichen Angaben dann selbst; eine Mitgliedsbescheinigung wird nicht benötigt.'
    'PrivateInsurance': '4.2 Sind Sie bei einem deutschen privaten Krankenversicherungsunternehmen versichert beziehungsweise Mitglied der Krankenversorgung der Bundesbahnbeamten (KVB), der Postbeamtenkrankenkasse (PBeaKK) oder einer anerkannten Solidargemeinschaft?'
    'PrivateInsurance.no': 'nein'
    'PrivateInsurance.yes': 'ja'
    'R0821Notice': 'Bitte lassen Sie von Ihrem Versicherungsunternehmen, der KVB, der PBeaKK beziehungsweise Ihrer Solidargemeinschaft den Vordruck R0821 ausfüllen und bestätigen.'
    'R0821Status': 'Vordruck R0821'
    'R0821Status.attached': 'ist beigefügt'
    'R0821Status.later': 'wird nachgereicht'
    'R0821Status.forwarded': 'wurde weitergeleitet'
    'ForeignInsurance': '4.3 Sind Sie freiwillig bei einer ausländischen gesetzlichen Krankenversicherung oder bei einem privaten Krankenversicherungsunternehmen versichert, die oder das der Aufsicht eines Mitgliedstaates der EU (Vereinigtes Königreich nur bis 31.12.2020), Islands, Liechtensteins, Norwegens oder der Schweiz unterliegt?'
    'ForeignInsurance.no': 'nein'
    'ForeignInsurance.yes': 'ja'
    'R0822Notice': 'Bitte lassen Sie von Ihrem Versicherungsunternehmen den Vordruck R0822 ausfüllen und bestätigen.'
    'R0822Status': 'Vordruck R0822'
    'R0822Status.attached': 'ist beigefügt'
    'R0822Status.later': 'wird nachgereicht'
    'R0822Status.forwarded': 'wurde weitergeleitet'
    'MultipleInsurersNotice': 'Sind Sie bei mehreren Versicherungsunternehmen krankenversichert, muss jedes Unternehmen jeweils einen Vordruck R0821 beziehungsweise R0822 ausfüllen.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step5':
    'IntroText': 'Beitragsaufwendungen für Familienangehörige'
    'FamilyNotice': 'Beitragsaufwendungen für Ehegatten, Lebenspartner oder Kinder können berücksichtigt werden, wenn der Familienangehörige mit seinem Gesamteinkommen 1/7 der monatlichen Bezugsgröße nicht übersteigt (2026: 565 EUR; bei geringfügiger Beschäftigung 603 EUR), selbst nicht in einer deutschen oder ausländischen gesetzlichen Krankenversicherung pflichtversichert ist und selbst als Rentenbezieher keinen Anspruch auf den Zuschuss zur Krankenversicherung hat.'
    'FamilyContributions': '4.4 Sollen Beitragsaufwendungen bei einer privaten Krankenversicherung für Familienangehörige berücksichtigt werden?'
    'FamilyContributions.no': 'nein'
    'FamilyContributions.yes': 'ja'
    'DEFAULT_SELECT': 'Bitte auswählen'
    'FamilyFormNotice': 'Bitte lassen Sie die Beitragsaufwendungen ebenfalls im Vordruck R0821 / R0822 eintragen.'
    'FamilyMemberLastName': 'Name des Familienangehörigen'
    'FamilyMemberFirstName': 'Vorname'
    'FamilyMemberBirthDate': 'Geburtsdatum'
    'FamilyMemberRelationship': 'Verwandtschaftsverhältnis'
    'FamilyMemberRelationship.spouse': 'Ehegatte / Ehegattin'
    'FamilyMemberRelationship.partner': 'Lebenspartner / Lebenspartnerin'
    'FamilyMemberRelationship.child': 'Kind'
    'FamilyMemberIncome': 'Höhe des monatlichen Gesamteinkommens des Familienangehörigen (EUR)'
    'FamilyMemberIncomeDescription': 'Kein Einkommen: bitte 0 eintragen.'
    'FamilyMemberPensioner': '4.4.1 Ist der Familienangehörige Rentner?'
    'FamilyMemberPensioner.no': 'nein'
    'FamilyMemberPensioner.yes': 'ja'
    'FamilyMemberPensionInsurer': 'Rentenversicherungsträger'
    'FamilyMemberPensionNumber': 'Versicherungsnummer (optional)'
    'FamilyMemberPensionSince': 'Rente seit'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step6':
    'IntroText': 'Versicherungspflicht und Dokumentenzugang'
    'CompulsoryInsurance': '4.5 Besteht oder bestand in der Zeit, für die Sie einen Zuschuss beantragen, Versicherungspflicht in einer deutschen oder ausländischen gesetzlichen Krankenversicherung?'
    'CompulsoryInsurance.no': 'nein'
    'CompulsoryInsurance.yes': 'ja'
    'DEFAULT_SELECT': 'Bitte auswählen'
    'CompulsoryInsuranceDescription': 'Der Zuschuss wird nicht gezahlt, solange Sie in einer deutschen oder ausländischen gesetzlichen Krankenversicherung pflichtversichert sind. Bitte auch angeben, wenn Sie zu Lasten eines anderen EU-Staates, Islands, Liechtensteins, Norwegens, der Schweiz oder des Vereinigten Königreichs bei einer deutschen Krankenkasse als Leistungsberechtigter eingeschrieben sind.'
    'CompulsoryInsurer': 'Name und Anschrift der Krankenkasse oder des Gesundheitsdienstes'
    'CompulsoryReason': 'Grund der Versicherungspflicht'
    'CompulsoryReasonDescription': 'Zum Beispiel Beschäftigungsverhältnis, Versicherungspflicht als Arbeitsloser, Einwohnerkrankenversicherung.'
    'AccessibilityHeader': 'Dokumentenzugang für sehbehinderte Menschen'
    'AccessibilityNotice': 'Menschen mit einer Behinderung (zum Beispiel blinde oder sehbehinderte Menschen) haben Anspruch darauf, Dokumente zusätzlich in einer für sie wahrnehmbaren Form zu erhalten.'
    'AccessibleFormat': 'Dokumente zusätzlich erhalten (optional)'
    'AccessibleFormat.large_print': 'als Großdruck'
    'AccessibleFormat.braille_short': 'in Braille (Kurzschrift)'
    'AccessibleFormat.braille_full': 'in Braille (Vollschrift)'
    'AccessibleFormat.cd': 'als CD (Schriftdatei / Textdatei im ".doc"-Format)'
    'AccessibleFormat.daisy': 'als Hörmedium (CD-DAISY Format)'
    'AccessibleFormatNone': 'nicht erforderlich'
  'Kalakotra\EFormRenteR0820\Forms\Form_Step7':
    'IntroText': 'Erklärung der Antragstellerin / des Antragstellers'
    'DeclarationIntro': 'Ich versichere, dass ich sämtliche Angaben in diesem Vordruck nach bestem Wissen gemacht habe. Mir ist bekannt, dass wissentlich falsche Angaben zu einer strafrechtlichen Verfolgung führen können.'
    'DeclarationDuties': 'Ich verpflichte mich, dem Rentenversicherungsträger die nachfolgenden Sachverhalte unverzüglich anzuzeigen:'
    'DutyA': 'a) die Beendigung oder das Ruhen der Versicherung, zu der der Zuschuss gezahlt wird (zum Beispiel bei Anspruch auf Krankenversorgung nach dem Bundesversorgungsgesetz, dem Bundesentschädigungsgesetz oder bei Auslandsaufenthalt),'
    'DutyB': 'b) jede Veränderung der Beitragshöhe oder Prämienhöhe zur privaten Krankenversicherung,'
    'DutyC': 'c) den Beginn einer Versicherungspflicht in der deutschen gesetzlichen Krankenversicherung (zum Beispiel durch die Aufnahme einer Beschäftigung, durch den Antrag auf eine weitere Rente, durch den Bezug von Übergangsgeld, Arbeitslosengeld oder Grundsicherungsgeld / Bürgergeld),'
    'DutyD': 'd) den Beginn einer Versicherungspflicht in der ausländischen gesetzlichen Krankenversicherung (zum Beispiel bei Wohnsitzverlegung ins Ausland, bei Aufnahme einer ausländischen Beschäftigung oder aufgrund des Beginns einer ausländischen Rente),'
    'DutyE': 'e) die "Einschreibung" als Leistungsberechtigter bei einer deutschen gesetzlichen Krankenkasse aufgrund der Rente eines anderen Staates der EU, Islands, Liechtensteins, Norwegens, der Schweiz oder des Vereinigten Königreichs,'
    'DutyF': 'f) jede Änderung in den Verhältnissen des Familienangehörigen, dessen Beitragsaufwendungen bei der Zuschusszahlung berücksichtigt werden (eigene Rentenberechtigung, Eintritt von Versicherungspflicht, Änderungen der Beitragsaufwendungen oder des Gesamteinkommens) und'
    'DutyG': 'g) den Verzug in einen anderen Staat.'
    'DeclarationAccepted': 'Ich habe die Erklärung gelesen und bestätige sie.'
    'BeihilfeNotice': 'Haben Sie Anspruch auf Beihilfe, fragen Sie bitte Ihre Beihilfestelle, ob sich der Zuschuss auf Ihren Beihilfeanspruch auswirkt. Sie können auf den Zuschuss oder Teile davon mit Wirkung für die Zukunft verzichten.'
    'Place': 'Ort'
    'PlaceDescription': 'Das Datum wird beim Erstellen des PDF automatisch eingetragen. Bei Waisen unterschreibt der gesetzliche Vertreter.'
  'Kalakotra\EFormRenteR0820\Forms\Form_Preview':
    'ConfirmationEmail': 'Ihre E-Mail-Adresse:'
    'AcceptTerms': 'Ich habe die <a href="/de/agb" target="_blank">AGB</a> und die <a href="/de/datenschutz" target="_blank">Datenschutzerklärung</a> gelesen und akzeptiert.'
    'AcceptNoReturn': 'Ich stimme ausdrücklich zu, dass Sie vor Ablauf der Widerrufsfrist mit der Ausführung des Vertrages beginnen. Mir ist bekannt, dass ich durch diese Zustimmung mit Beginn der Ausführung des Vertrages mein Widerrufsrecht verliere.'
    'SignatureRequired': 'Bitte unterschreiben Sie den Antrag.'
